<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Impede o "tema escuro automático" de navegadores de celular de recolorir o jogo. As cores do jogo já têm contraste WCAG conferido. -->
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#1f3a93">
<title>Torre Horizonte</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%231f3a93'/%3E%3Cpath d='M7 20V5h7v15M14 9h3v11M5 20h14' stroke='%23fff' stroke-width='1.8' fill='none'/%3E%3C/svg%3E">
<style>
/* ===================== TORRE HORIZONTE · estilo =====================
   Ideia visual: papelaria de escritório. Tinta de caneta azul (ação), post-it amarelo (seleção),
   caneta vermelha de revisão (erro), carimbo verde (aprovado). Documentos em serifa; interface em sans.
   Só fundo claro (o jogo pede color-scheme: only light). Contraste conferido por pixel (tests/contraste_px.py). */
:root {
  color-scheme: only light;
  --fundo: #e6e9ee;
  --papel: #fbfbf7;
  --papel2: #f1f2ee;
  --tinta: #23252b;
  --tinta2: #474c58;
  --caneta: #1f3a93;
  --caneta-esc: #162b6e;
  --caneta-clara: #e3e8f7;
  --postit: #ffe066;
  --postit-borda: #a8860d;
  --revisao: #b3261e;
  --revisao-clara: #fbe6e4;
  --carimbo: #1e7a46;
  --carimbo-clara: #e2f2e8;
  --linha: #cfd4dd;
  --linha-forte: #7d8597;
  --sombra: 0 1px 0 #c4c9d3, 0 6px 14px -8px rgba(31, 42, 70, .35);
  --raio: 6px;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
  --doc: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, "Noto Serif", "DejaVu Serif", serif;
  --base: 17px;
  --entrelinha: 1.55;
}
@media (min-width: 900px) { :root { --base: 18px; } }
html { font-size: var(--base); }
html[data-fonte="1"] { font-size: calc(var(--base) * 1.15); }
html[data-fonte="2"] { font-size: calc(var(--base) * 1.3); }
html.espaco-largo { --entrelinha: 1.85; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: var(--ui); line-height: var(--entrelinha); -webkit-text-size-adjust: 100%; }
h1, h2, h3 { line-height: 1.2; margin: .2em 0 .5em; letter-spacing: -.01em; }
h1 { font-size: 1.9rem; font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 750; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: .5em 0; }
a { color: var(--caneta); text-underline-offset: 2px; }
code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: .88em; background: var(--papel2); padding: .05em .35em; border-radius: 4px; word-break: break-all; }
hr { border: 0; border-top: 1px solid var(--linha); margin: 16px 0; }
.small { font-size: .88rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.spacer { flex: 1; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.largo { width: 100%; justify-content: center; }
.ico { width: 1.2em; height: 1.2em; vertical-align: -.22em; flex: none; }
:focus-visible { outline: 3px solid var(--caneta); outline-offset: 2px; border-radius: 4px; }
[tabindex="-1"]:focus { outline: none; }
.pular { position: absolute; left: -999px; top: 8px; background: var(--papel); padding: 8px 12px; z-index: 100; }
.pular:focus { left: 8px; }
.erro-txt { color: var(--revisao); font-weight: 600; }
.ok-txt { color: var(--carimbo); font-weight: 600; }

/* ---------- botões ---------- */
.btn { font: inherit; font-size: .95rem; display: inline-flex; align-items: center; gap: .45em; min-height: 44px; padding: 8px 14px; border-radius: var(--raio);
  border: 2px solid var(--linha-forte); background: var(--papel); color: var(--tinta); cursor: pointer; font-weight: 600; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--caneta); color: var(--caneta); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.pri { background: var(--caneta); border-color: var(--caneta); color: #fff; }
.btn.pri:hover:not(:disabled) { background: var(--caneta-esc); color: #fff; }
.btn.grande { font-size: 1.05rem; padding: 12px 20px; }
.btn.mini { min-height: 38px; padding: 5px 10px; font-size: .86rem; }
.btn.perigo { border-color: var(--revisao); color: var(--revisao); }
.btn.sem-voz { opacity: .8; }
.icobtn { background: transparent; border: 0; color: #fff; width: 44px; height: 44px; border-radius: var(--raio); cursor: pointer; display: inline-grid; place-items: center; }
.icobtn:hover { background: rgba(255, 255, 255, .14); }
.icobtn .ico { width: 24px; height: 24px; }
.icobtn:focus-visible { outline-color: var(--postit); }

/* ---------- casca ---------- */
#topo { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 6px 14px; background: var(--caneta); color: #fff; }
#topo .marca { display: flex; align-items: center; gap: 10px; }
#topo .marca .logo { width: 38px; height: 38px; display: grid; place-items: center; background: #fff; color: var(--caneta); border-radius: 6px; }
#topo .marca .logo .ico { width: 26px; height: 26px; }
#topo .marca b { display: block; font-size: 1.02rem; }
#topo .marca span { font-size: .78rem; color: #d9e0f5; }
#topo .jog { display: flex; align-items: center; gap: 4px; }
#topo .cx { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
.painel-elev { display: flex; gap: 4px; background: #10204f; padding: 4px; border-radius: 6px; }
.painel-elev i { font-style: normal; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font-size: .8rem; font-weight: 700; color: #c3cbe6; border: 1.5px solid #4a5a8f; }
.painel-elev i.feito { background: var(--carimbo); border-color: #7fd3a2; color: #fff; }
.painel-elev i.aqui { background: var(--postit); color: var(--tinta); border-color: var(--postit); }
.painel-elev i.obra { border-style: dashed; color: #b9c2e0; }
.casca { max-width: 1240px; margin: 0 auto; padding: 18px 16px 90px; }
.casca.com-menu { display: grid; grid-template-columns: 190px 1fr; gap: 20px; align-items: start; }
#menu { position: sticky; top: 74px; display: grid; gap: 4px; }
#menu button { font: inherit; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 8px 12px; border: 0; border-left: 4px solid transparent; background: transparent; color: var(--tinta); text-align: left; cursor: pointer; border-radius: 0 6px 6px 0; font-weight: 600; }
#menu button:hover { background: var(--papel); }
#menu button.ativo { background: var(--papel); border-left-color: var(--caneta); color: var(--caneta); }
#view { min-width: 0; outline: none; }
.painel { background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; box-shadow: var(--sombra); }
.painel .tit { display: flex; align-items: center; gap: 8px; font-size: 1.15rem; margin-top: 0; }
.chip, .aviso-chip { display: inline-block; padding: 4px 10px; border-radius: 999px; background: var(--papel2); border: 1px solid var(--linha); font-size: .85rem; font-weight: 600; }
.aviso-chip { border-radius: var(--raio); background: var(--postit); border-color: var(--postit-borda); padding: 8px 12px; margin: 0 0 12px; }
.aviso-chip.ruim { background: var(--revisao-clara); border-color: var(--revisao); color: var(--revisao); }
@media (max-width: 860px) {
  .casca.com-menu { display: block; }
  #menu { position: fixed; top: auto; bottom: 0; left: 0; right: 0; z-index: 25; display: flex; justify-content: space-around; background: var(--papel); border-top: 1px solid var(--linha); padding: 2px 2px calc(2px + env(safe-area-inset-bottom)); gap: 0; }
  #menu button { flex-direction: column; gap: 2px; font-size: .7rem; padding: 6px 4px; border-left: 0; border-top: 3px solid transparent; border-radius: 0; flex: 1; min-width: 0; text-align: center; }
  #menu button.ativo { border-top-color: var(--caneta); background: var(--caneta-clara); }
  #menu button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  #topo { flex-wrap: wrap; padding: 6px 10px; }
  #topo .marca span { display: none; }
  .painel-elev { order: 3; width: 100%; justify-content: center; background: transparent; padding: 0 0 4px; }
  #topo .cx.nome { display: none; }
  .casca { padding: 14px 12px 96px; }
  h1 { font-size: 1.6rem; }
}

/* ---------- início ---------- */
.capa { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 8px 4px 22px; border-bottom: 3px solid var(--tinta); margin-bottom: 20px; }
.capa h1 { font-size: clamp(2.4rem, 7vw, 4.2rem); font-weight: 850; letter-spacing: -.035em; margin: 0; line-height: .95; color: var(--caneta); }
.capa-empresa { font-weight: 700; color: var(--tinta2); margin: 0 0 8px; }
.capa-sub { font-size: 1.12rem; max-width: 34ch; margin: 12px 0 0; }
.capa-predio { display: grid; grid-template-columns: 54px; gap: 3px; padding: 6px; background: var(--tinta); border-radius: 4px 4px 0 0; }
.capa-predio span { height: 26px; display: grid; place-items: center; font-weight: 800; font-size: .8rem; color: #8d93a1; background: #3a3d46; border-radius: 2px; }
.capa-predio span.acesa { background: var(--postit); color: var(--tinta); }
.capa-predio span.portaria { background: var(--caneta); color: #fff; }
.inicio-grade { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; align-items: start; }
.area-treino { display: flex; gap: 16px; align-items: center; grid-column: 1 / -1; }
.area-treino.chamada { border: 2px solid var(--caneta); background: var(--caneta-clara); }
.area-treino h2 { margin-top: 0; }
.bento-g { width: 96px; height: 96px; flex: none; }
.bento-m { width: 64px; height: 64px; flex: none; }
.area-form h2 { display: flex; align-items: center; gap: 8px; margin-top: 0; }
.escola-fixa { display: flex; align-items: center; gap: 6px; color: var(--tinta2); }
.campo { margin-bottom: 12px; }
.campo label { display: block; font-weight: 600; margin-bottom: 4px; }
.campo input, .campo select { width: 100%; font: inherit; padding: 10px 12px; min-height: 46px; border: 2px solid var(--linha-forte); border-radius: var(--raio); background: #fff; color: var(--tinta); }
.campo select:disabled { background: var(--papel2); }
@media (max-width: 760px) { .inicio-grade { grid-template-columns: 1fr; } .capa { grid-template-columns: 1fr; } .capa-predio { display: none; } .area-treino { flex-direction: column; align-items: flex-start; } }

/* ---------- elevador (mapa) ---------- */
.mapa-grade { display: grid; grid-template-columns: minmax(280px, 440px) 1fr; gap: 20px; align-items: start; }
.predio { background: var(--tinta); padding: 10px 10px 0; border-radius: 6px 6px 0 0; display: grid; gap: 6px; }
.pavimento { font: inherit; color: var(--tinta); display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 10px; width: 100%; min-height: 64px; padding: 8px 12px; text-align: left; cursor: pointer;
  background: var(--papel); border: 2px solid transparent; border-radius: 3px; position: relative; }
.pavimento .pav-num { font-size: 1.6rem; font-weight: 850; color: var(--caneta); text-align: center; font-variant-numeric: tabular-nums; }
.pavimento .pav-txt b { display: block; font-size: 1.02rem; }
.pavimento .pav-txt small { font-size: .82rem; color: var(--tinta2); display: inline-flex; align-items: center; gap: 4px; }
.pavimento .janelas { display: none; }
.pavimento.feito { background: var(--carimbo-clara); }
.pavimento.feito .pav-num { color: var(--carimbo); }
.pavimento.bloq { background: #d6dae2; }
.pavimento.bloq .pav-num { color: var(--tinta2); }
.pavimento.obra { background: repeating-linear-gradient(-45deg, #d9dce3 0 10px, #cfd3db 10px 20px); color: var(--tinta); cursor: default; }
.pavimento.obra[data-andar] { cursor: pointer; }
.pavimento.obra .pav-num { color: var(--tinta2); }
.pavimento.aqui::after { content: ""; position: absolute; left: -10px; top: 50%; width: 0; height: 0; border: 9px solid transparent; border-left-color: var(--postit); transform: translateY(-50%); }
.pavimento.sel { border-color: var(--postit); box-shadow: inset 0 0 0 2px var(--postit-borda); }
.cobertura { grid-template-columns: auto 1fr; display: flex; align-items: center; gap: 8px; font-weight: 700; cursor: default; min-height: 48px; }
.cobertura small { margin-left: auto; font-weight: 600; color: var(--tinta2); }
.terreo { background: var(--caneta); color: #fff; margin: 0 -10px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; }
.terreo .btn { background: #fff; }
.col-lado { display: grid; gap: 16px; }
.missao .destaque { font-size: 1.12rem; font-weight: 700; color: var(--caneta); }
.missao ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.missao li { display: flex; gap: 10px; align-items: flex-start; }
.missao li .cx { width: 22px; height: 22px; flex: none; border: 2px solid var(--linha-forte); border-radius: 4px; display: grid; place-items: center; font-weight: 800; color: #fff; margin-top: 2px; }
.missao li.ok .cx { background: var(--carimbo); border-color: var(--carimbo); }
.det-andar .setor { color: var(--tinta2); font-weight: 600; margin: 0; }
.det-andar h2 { margin-top: 4px; }
.estrelas { color: #8a6500; font-size: 1.3rem; letter-spacing: 2px; }
.estrela-vazia { color: #b6bcc8; }
@media (max-width: 860px) { .mapa-grade { grid-template-columns: 1fr; } }

/* ---------- intro do andar ---------- */
.intro-andar { max-width: 760px; margin: 10px auto; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 24px; box-shadow: var(--sombra); }
.intro-placa { display: flex; gap: 16px; align-items: center; }
.intro-placa .num { font-size: 3.4rem; font-weight: 900; line-height: 1; color: #fff; background: var(--caneta); width: 84px; height: 84px; display: grid; place-items: center; border-radius: 6px; flex: none; }
.intro-placa .setor { margin: 0; font-weight: 600; color: var(--tinta2); }
.intro-placa h1 { margin: 0; }
.intro-frase { font-size: 1.15rem; font-family: var(--doc); font-style: italic; border-left: 4px solid var(--postit-borda); padding-left: 12px; }
.intro-manual { display: flex; gap: 12px; align-items: center; background: var(--caneta-clara); border-radius: var(--raio); padding: 12px; margin-top: 14px; flex-wrap: wrap; }
.intro-manual > .ico { width: 34px; height: 34px; color: var(--caneta); }
.intro-manual div { flex: 1; min-width: 200px; }
.intro-manual span { display: block; font-size: .88rem; color: var(--tinta2); }

/* ---------- temas por andar (só o cabeçalho do desafio e a placa mudam: o papel continua claro) ---------- */
body[data-tema="t1"] .hud { background: #2b2d33; color: #f3f3ee; }
body[data-tema="t1"] .intro-placa .num { background: #2b2d33; }
body[data-tema="t1"] .enunciado { border-image: none; position: relative; }
body[data-tema="t1"] .enunciado::before, body[data-tema="t1"] .enunciado::after { content: ""; position: absolute; width: 22px; height: 22px; border: 3px solid #2b2d33; pointer-events: none; }
body[data-tema="t1"] .enunciado::before { top: 6px; left: 6px; border-right: 0; border-bottom: 0; }
body[data-tema="t1"] .enunciado::after { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }
.rec { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; color: #ff8b8b; }
.rec .ico { color: #ff5a5a; }
body[data-tema="t2"] .hud { background: #11324a; color: #f1f6f9; }
body[data-tema="t2"] .intro-placa .num { background: #11324a; color: #ffb547; }
body[data-tema="t2"] .intro-frase { border-left-color: #c46a00; }
.zona-ind { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; color: #ffb547; }
html.modo-foco .rec, html.modo-foco .zona-ind, html.modo-foco body[data-tema] .enunciado::before, html.modo-foco body[data-tema] .enunciado::after, html.modo-foco .capa-predio, html.modo-foco .medidores { display: none !important; }

/* ---------- desafio ---------- */
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; background: var(--caneta); color: #fff; border-radius: var(--raio) var(--raio) 0 0; }
.hud .btn { background: var(--papel); }
.hud-andar { font-weight: 800; }
.chances { display: inline-flex; gap: 2px; align-items: center; }
.chances b { margin-left: 2px; }
.coracao { width: 26px; height: 26px; }
.coracao .fundo { fill: none; stroke: currentColor; stroke-width: 1.8; opacity: .75; }
.coracao .cheia { fill: #ff6b6b; stroke: #ff6b6b; stroke-width: 1.8; }
.chances .ico.cheio:not(.coracao) { color: #ff6b6b; }
.medidores { display: inline-flex; gap: 8px; flex-wrap: wrap; font-size: .78rem; }
.med { display: inline-flex; align-items: center; gap: 4px; }
.med i { display: inline-block; width: 34px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .25); position: relative; overflow: hidden; }
.med i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: #9fe0b8; }
.med.baixo i::after { background: #ffb547; }
.enunciado { background: var(--papel); border: 1px solid var(--linha); border-top: 0; padding: 16px 20px; margin-bottom: 14px; box-shadow: var(--sombra); border-radius: 0 0 var(--raio) var(--raio); }
.enunciado h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 0; }
.tipo-chip { font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--caneta-clara); color: var(--caneta); }
.cena { font-size: 1.04rem; max-width: 70ch; }
.tarefa { font-weight: 700; font-size: 1.08rem; color: var(--caneta); max-width: 70ch; }
.lendo { outline: 3px dashed var(--postit-borda); outline-offset: 4px; }
.inv { margin-bottom: 10px; }
.mesa { margin-bottom: 14px; }
.mesa.congelada { filter: none; }
.painel-titulo { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-weight: 700; margin-bottom: 8px; }
.vazio { color: var(--tinta2); font-style: italic; padding: 10px; margin: 0; list-style: none; }
.acoes-exec { display: flex; justify-content: center; margin: 6px 0 14px; }
.acoes-exec .btn { min-width: 220px; justify-content: center; }
.info { background: var(--caneta-clara); border-left: 4px solid var(--caneta); padding: 10px 14px; border-radius: 4px; }
.tremer { animation: tremer .4s; }
@keyframes tremer { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.pulsa { box-shadow: 0 0 0 0 rgba(31, 58, 147, .5); animation: pulsa 2.4s infinite; }
@keyframes pulsa { 70% { box-shadow: 0 0 0 10px rgba(31, 58, 147, 0); } 100% { box-shadow: 0 0 0 0 rgba(31, 58, 147, 0); } }

/* classificar */
.cls-caixa { background: var(--papel); border: 2px dashed var(--linha-forte); border-radius: var(--raio); padding: 12px; }
.cls-cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.cartao { font: inherit; font-size: .98rem; text-align: left; line-height: 1.4; padding: 12px 14px; min-height: 48px; background: #fff; color: var(--tinta); border: 1px solid var(--linha); border-left: 5px solid var(--caneta); border-radius: 4px; cursor: pointer; box-shadow: 0 2px 0 #d5d9e1; width: 100%; }
.cartao:hover { border-color: var(--caneta); }
.cartao.sel { background: var(--postit); border-color: var(--postit-borda); border-left-color: var(--postit-borda); box-shadow: 0 0 0 3px var(--postit-borda); }
.cartao.fixo { border-left-color: var(--carimbo); background: var(--carimbo-clara); cursor: default; opacity: 1; }
.cls-ajuda { margin: 10px 2px; font-weight: 600; color: var(--tinta2); }
.cls.escolhendo .cls-ajuda { color: var(--caneta); }
.cls-cols { display: grid; gap: 10px; }
.cls-cols.cols-2 { grid-template-columns: repeat(2, 1fr); }
.cls-cols.cols-4 { grid-template-columns: repeat(4, 1fr); }
.cls-cols.cols-5 { grid-template-columns: repeat(5, 1fr); }
.coluna { background: var(--papel2); border: 1px solid var(--linha); border-radius: var(--raio); display: flex; flex-direction: column; min-height: 150px; }
.col-cab { font: inherit; text-align: left; background: var(--papel); border: 0; border-bottom: 3px solid var(--caneta); padding: 10px 12px; cursor: pointer; border-radius: var(--raio) var(--raio) 0 0; color: var(--tinta); min-height: 64px; }
.col-cab b { display: block; font-size: 1rem; color: var(--caneta); }
.col-cab span { display: block; font-size: .8rem; color: var(--tinta2); line-height: 1.3; }
.cls.escolhendo .col-cab { background: var(--caneta-clara); box-shadow: inset 0 0 0 2px var(--caneta); }
.cls.escolhendo .col-cab:hover { background: var(--postit); }
.col-corpo { padding: 8px; display: grid; gap: 8px; align-content: start; flex: 1; }
.zona-alvo { outline: 3px dashed var(--caneta); outline-offset: -3px; background: var(--caneta-clara); }
@media (max-width: 1000px) { .cls-cols.cols-4, .cls-cols.cols-5 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .cls-cols.cols-2, .cls-cols.cols-4, .cls-cols.cols-5 { grid-template-columns: 1fr; } .coluna { min-height: 0; } .col-corpo:empty { display: none; } .cls-cartoes { grid-template-columns: 1fr; } }

/* escolher */
.esc-ops { display: grid; gap: 10px; }
.opcao { font: inherit; text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: #fff; border: 2px solid var(--linha); border-radius: var(--raio); cursor: pointer; color: var(--tinta); font-family: var(--doc); font-size: 1.04rem; line-height: 1.45; flex-wrap: wrap; }
.opcao .letra { font-family: var(--ui); font-weight: 800; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--caneta-clara); color: var(--caneta); flex: none; }
.opcao span:nth-child(2) { flex: 1; min-width: 180px; }
.opcao:hover:not(:disabled) { border-color: var(--caneta); }
.opcao.sel { background: var(--postit); border-color: var(--postit-borda); }
.opcao.fora { text-decoration: line-through; text-decoration-color: var(--revisao); opacity: .7; }
.opcao.motivo { font-family: var(--ui); }
.esc-feita { background: var(--carimbo-clara); border-left: 5px solid var(--carimbo); padding: 10px 14px; border-radius: 4px; font-family: var(--doc); margin-bottom: 12px; }
.carimbo-mini { font-family: var(--ui); font-weight: 800; color: var(--carimbo); display: inline-flex; gap: 4px; align-items: center; }
.esc-pergunta { margin-top: 0; }

/* inspecionar */
.doc { font-family: var(--doc); background: #fff; border: 1px solid var(--linha); border-radius: 3px; box-shadow: var(--sombra); }
.doc-cab { font-family: var(--ui); font-weight: 700; padding: 10px 16px; border-bottom: 1px solid var(--linha); display: flex; align-items: center; gap: 8px; background: var(--papel2); }
.doc-convite dl { margin: 0; padding: 10px 16px 14px; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
.doc-convite dt { font-family: var(--ui); font-weight: 700; color: var(--tinta2); padding-top: 6px; }
.doc-convite dd { margin: 0; }
.doc-texto { padding: 14px 18px; margin: 0; font-size: 1.08rem; line-height: 1.9; }
.trecho { font: inherit; color: inherit; background: transparent; border: 0; padding: 2px 3px; margin: 0 -1px; cursor: pointer; border-radius: 3px; text-align: left; line-height: inherit; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.trecho:hover { background: var(--postit); }
.trecho.marcado { background: var(--revisao-clara); color: var(--revisao); text-decoration: underline wavy var(--revisao); text-decoration-thickness: 2px; text-underline-offset: 4px; font-weight: 600; }
.trecho.fixo { opacity: 1; }
.insp-ajuda { color: var(--tinta2); }
.insp-sub { display: flex; gap: 8px; align-items: center; margin: 18px 0 2px; }
.faltas { display: grid; gap: 8px; margin-top: 8px; }
.falta { font: inherit; text-align: left; display: flex; gap: 10px; align-items: center; padding: 10px 12px; min-height: 48px; background: #fff; border: 2px solid var(--linha); border-radius: var(--raio); cursor: pointer; color: var(--tinta); }
.falta .caixinha { width: 24px; height: 24px; flex: none; border: 2px solid var(--linha-forte); border-radius: 4px; display: grid; place-items: center; font-weight: 900; color: #fff; }
.falta.sel { border-color: var(--caneta); background: var(--caneta-clara); }
.falta.sel .caixinha { background: var(--caneta); border-color: var(--caneta); }
@media (max-width: 520px) { .doc-convite dl { grid-template-columns: 1fr; } .doc-convite dt { padding-top: 2px; } }

/* montar */
.mnt { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; align-items: start; }
.doc-montado { list-style: none; margin: 0; padding: 12px; min-height: 140px; display: grid; gap: 8px; counter-reset: bl; }
.bloco { font: inherit; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--papel); border: 1px solid var(--linha); border-radius: 4px; color: var(--tinta); text-align: left; line-height: 1.4; }
.doc-montado .bloco { font-family: var(--doc); counter-increment: bl; }
.doc-montado .bloco::before { content: counter(bl); font-family: var(--ui); font-weight: 800; color: var(--caneta); min-width: 1.2em; }
.bloco .txt { flex: 1; }
.bloco .alca { color: var(--tinta2); cursor: grab; padding: 6px 4px; touch-action: none; font-size: 1.2rem; }
.bloco .ctrl { display: flex; gap: 4px; flex: none; }
.bloco .ctrl button { font: inherit; width: 40px; height: 40px; border: 1.5px solid var(--linha-forte); background: #fff; border-radius: 4px; cursor: pointer; color: var(--tinta); font-weight: 700; }
.bloco .ctrl button:disabled { opacity: .35; }
.pool { display: grid; gap: 8px; }
.bloco.solto { cursor: pointer; border-left: 5px solid var(--caneta); width: 100%; font-family: var(--doc); }
.bloco.solto:hover { border-color: var(--caneta); }
.bloco.arrastando { opacity: .35; }
.fantasma { position: fixed; z-index: 90; pointer-events: none; box-shadow: 0 10px 24px rgba(0, 0, 0, .25); transform: rotate(-1.5deg); }
@media (max-width: 860px) { .mnt { grid-template-columns: 1fr; } .mnt-pool { order: -1; } }

/* retorno */
.didatica { border-radius: var(--raio); padding: 16px 18px; position: relative; }
.didatica h3 { display: flex; align-items: center; gap: 8px; margin-top: 0; }
.didatica.erro { background: var(--revisao-clara); border: 2px solid var(--revisao); }
.didatica.erro h3 { color: var(--revisao); }
.didatica.ok { background: var(--carimbo-clara); border: 2px solid var(--carimbo); padding-top: 22px; }
.didatica.ok h3 { color: var(--carimbo); }
.res-msg { font-weight: 700; }
.porque { padding-left: 1.2em; display: grid; gap: 10px; }
ul.porque { list-style: none; padding-left: 0; }
.porque li b { font-family: var(--doc); font-weight: 600; }
.etq { display: inline-block; font-size: .74rem; font-weight: 800; padding: 1px 8px; border-radius: 3px; background: var(--caneta); color: #fff; margin-right: 6px; vertical-align: 1px; }
.etq.ruim { background: var(--revisao); }
.fim-ret { margin-top: 12px; }
details summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
.carimbo { position: absolute; top: -18px; right: 14px; transform: rotate(-8deg); pointer-events: none; }
.carimbo span { display: inline-block; font-weight: 900; font-size: 1.05rem; letter-spacing: .06em; color: var(--carimbo); border: 3px solid var(--carimbo); border-radius: 6px; padding: 2px 12px; background: var(--papel); animation: carimbar .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes carimbar { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- vitória / fim de turno ---------- */
.vitoria { max-width: 720px; margin: 30px auto; text-align: center; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 40px 24px 26px; box-shadow: var(--sombra); position: relative; }
.vitoria .carimbo { position: static; display: block; transform: rotate(-6deg); margin-bottom: 10px; }
.vitoria .carimbo span { font-size: 1.5rem; padding: 6px 18px; }
.vit-estrelas .estrelas { font-size: 2.6rem; }
.fim-turno { position: fixed; inset: 0; z-index: 80; background: rgba(35, 37, 43, .82); display: grid; place-items: center; padding: 16px; }
.fim-caixa { background: var(--papel); border-top: 8px solid var(--revisao); border-radius: var(--raio); padding: 24px; max-width: 520px; text-align: center; }
.aviso-hack { max-width: 640px; margin: 40px auto; text-align: center; border-top: 8px solid var(--revisao); }

/* ---------- foco ---------- */
.foco-fundo { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; padding: 16px; }
.foco-fundo.susto { background: #8f1d17; color: #fff; }
.foco-fundo.alivio { background: rgba(35, 37, 43, .86); }
.foco-caixa { max-width: 560px; text-align: center; }
.foco-fundo.alivio .foco-caixa { background: var(--papel); color: var(--tinta); border-radius: var(--raio); padding: 24px; border-top: 8px solid var(--postit-borda); }
#badge-print { display: none; position: fixed; bottom: 80px; right: 12px; z-index: 70; background: var(--postit); color: var(--tinta); padding: 8px 12px; border-radius: var(--raio); font-weight: 700; box-shadow: var(--sombra); }

/* ---------- modal, toast ---------- */
.modal-fundo { position: fixed; inset: 0; z-index: 60; background: rgba(35, 37, 43, .55); display: grid; place-items: center; padding: 14px; }
.modal { background: var(--papel); border-radius: var(--raio); padding: 20px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); }
.modal.modal-largo { max-width: 760px; }
.modal h2 { display: flex; align-items: center; gap: 8px; margin-top: 0; }
.grade-botoes { display: grid; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 95; background: var(--tinta); color: #fff; padding: 10px 16px; border-radius: var(--raio); max-width: min(92vw, 520px); box-shadow: var(--sombra); font-weight: 600; }
.lista-ico { list-style: none; padding: 0; display: grid; gap: 10px; }
.lista-ico li { display: flex; gap: 10px; align-items: flex-start; }
.fala-bento { display: flex; gap: 14px; align-items: flex-start; }
.fala-bento h2 { margin-top: 0; }
.fala-bento p { font-size: 1.08rem; }

/* ---------- ajustes ---------- */
.aj-grupo { margin-bottom: 16px; }
.aj-grupo h3 { margin-bottom: 6px; font-size: 1rem; }
.segmentos { display: flex; border: 2px solid var(--linha-forte); border-radius: var(--raio); overflow: hidden; }
.seg { font: inherit; flex: 1; min-height: 46px; border: 0; background: #fff; cursor: pointer; font-weight: 600; color: var(--tinta); border-right: 1px solid var(--linha); }
.seg:last-child { border-right: 0; }
.seg.sel { background: var(--caneta); color: #fff; }
.liga { font: inherit; width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px; background: #fff; border: 2px solid var(--linha); border-radius: var(--raio); cursor: pointer; margin-bottom: 8px; color: var(--tinta); }
.liga small { display: block; color: var(--tinta2); font-size: .84rem; }
.chave-liga { width: 44px; height: 26px; border-radius: 13px; background: #b6bcc8; position: relative; flex: none; }
.chave-liga::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.liga.sel { border-color: var(--caneta); }
.liga.sel .chave-liga { background: var(--caneta); }
.liga.sel .chave-liga::after { left: 21px; }

/* ---------- manual ---------- */
.manual-grade { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
.caps { display: grid; gap: 6px; }
.caps .tit { margin-bottom: 0; }
.cap { font: inherit; text-align: left; padding: 10px 12px; border: 1px solid var(--linha); border-left: 4px solid var(--linha-forte); border-radius: 4px; background: #fff; cursor: pointer; color: var(--tinta); }
.cap b { display: block; }
.cap span { font-size: .82rem; color: var(--tinta2); display: inline-flex; gap: 4px; align-items: center; }
.cap.ativo { border-left-color: var(--caneta); background: var(--caneta-clara); }
.cap:disabled { cursor: not-allowed; background: var(--papel2); }
.ficha { background: #fff; border: 1px solid var(--linha); border-radius: var(--raio); padding: 22px 24px; box-shadow: var(--sombra); max-width: 760px; }
.ficha-topo { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--tinta2); font-weight: 600; }
.ficha-topo .lida { color: var(--carimbo); display: inline-flex; gap: 4px; align-items: center; }
.ficha h2 { font-size: 1.6rem; margin: 6px 0 10px; color: var(--caneta); }
.ficha-txt { font-size: 1.22rem; line-height: 1.6; max-width: 60ch; }
html.espaco-largo .ficha-txt { line-height: 1.9; }
.vis { margin: 16px 0; }
.vis-chat { background: #e9f5ee; border-radius: 14px 14px 14px 2px; padding: 10px 14px; max-width: 460px; }
.vis-chat .quem { font-weight: 700; font-size: .85rem; color: var(--carimbo); }
.vis-chat p { margin: 4px 0 0; font-size: 1.05rem; }
.vis-email { padding: 12px 16px; max-width: 560px; }
.vis-email div { font-family: var(--ui); font-size: .92rem; }
.vis-email div span { color: var(--tinta2); }
.vis-email p { font-size: 1.05rem; }
.vis-antes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vis-antes > div { padding: 10px 14px; border-radius: 4px; }
.vis-antes span { font-weight: 800; display: inline-flex; gap: 4px; align-items: center; font-size: .9rem; }
.vis-antes p { font-family: var(--doc); font-size: 1.05rem; margin: 6px 0 0; }
.vis-antes .ruim { background: var(--revisao-clara); border-left: 5px solid var(--revisao); }
.vis-antes .ruim span { color: var(--revisao); }
.vis-antes .bom { background: var(--carimbo-clara); border-left: 5px solid var(--carimbo); }
.vis-antes .bom span { color: var(--carimbo); }
.vis-lista { list-style: none; padding: 0; display: grid; gap: 6px; max-width: 520px; }
.vis-lista li { background: var(--postit); border-left: 5px solid var(--postit-borda); padding: 8px 12px; font-weight: 600; font-size: 1.05rem; }
.vis-agenda { padding: 12px 16px; max-width: 520px; }
.vis-agenda .ag-tit { font-family: var(--ui); font-weight: 800; color: var(--caneta); display: flex; gap: 6px; align-items: center; }
.vis-agenda dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 8px 0 0; }
.vis-agenda dt { font-family: var(--ui); font-weight: 700; color: var(--tinta2); }
.vis-agenda dd { margin: 0; }
.vis-torre { display: grid; gap: 3px; max-width: 280px; background: var(--tinta); padding: 6px; border-radius: 4px 4px 0 0; }
.vis-torre span { background: var(--postit); padding: 4px 10px; font-weight: 700; font-size: .92rem; }
.vis-torre span.obra { background: #3a3d46; color: #c8ccd6; }
.pag-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; max-width: 760px; flex-wrap: wrap; }
.pag-nav .pontos { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.pag-nav .pontos i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--linha-forte); }
.pag-nav .pontos i.lida { background: var(--carimbo); border-color: var(--carimbo); }
.pag-nav .pontos i.on { outline: 3px solid var(--caneta); outline-offset: 1px; }
@media (max-width: 860px) { .manual-grade { grid-template-columns: 1fr; } .caps { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } .caps .tit, .caps > p { grid-column: 1 / -1; } .ficha { padding: 18px; } .ficha-txt { font-size: 1.15rem; } }
@media (max-width: 520px) { .vis-antes { grid-template-columns: 1fr; } }

/* ---------- loja, salvar ---------- */
.loja-grade { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.bolsa { font-size: 1.2rem; display: flex; gap: 8px; align-items: center; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.slot { font: inherit; display: grid; justify-items: center; gap: 4px; padding: 14px 8px; background: #fff; border: 2px solid var(--linha); border-radius: var(--raio); cursor: pointer; color: var(--tinta); }
.slot .ico { width: 34px; height: 34px; color: var(--caneta); }
.slot .nm { font-weight: 700; font-size: .9rem; }
.slot .qtd { font-size: .85rem; color: var(--tinta2); }
.slot.sel { border-color: var(--postit-borda); background: var(--postit); }
.salvar { max-width: 760px; }
.passos { padding-left: 1.3em; display: grid; gap: 8px; }
@media (max-width: 760px) { .loja-grade { grid-template-columns: 1fr; } }

/* ---------- integração ---------- */
#tut-spot { position: fixed; z-index: 55; border: 4px solid var(--postit); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(35, 37, 43, .45); pointer-events: none; transition: all .2s; display: none; }
#tut-caixa { position: fixed; z-index: 58; left: 50%; transform: translateX(-50%); bottom: 12px; width: min(640px, calc(100vw - 20px)); display: flex; gap: 12px; align-items: flex-start; border: 3px solid var(--caneta); }
#tut-caixa.em-cima { bottom: auto; top: 70px; }
#tut-caixa .fala { flex: 1; }
#tut-caixa .passo { font-size: .8rem; color: var(--tinta2); }
#tut-caixa p { margin: 4px 0 10px; font-size: 1.02rem; }
#tut-caixa .opcoes { display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 520px) { #tut-caixa .bento-m { width: 44px; height: 44px; } }

/* ---------- área do professor ---------- */
.abas { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
.abas .btn.ativa { background: var(--caneta); color: #fff; border-color: var(--caneta); }
.tab { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tab th, .tab td { border-bottom: 1px solid var(--linha); padding: 8px; text-align: left; vertical-align: top; }
.tab th { background: var(--papel2); }
.tab tr.feito td { opacity: .55; text-decoration: line-through; }
.selo { display: inline-block; font-size: .78rem; font-weight: 800; padding: 2px 8px; border-radius: 3px; white-space: nowrap; }
.selo.confirmado { background: var(--carimbo-clara); color: var(--carimbo); border: 1px solid var(--carimbo); }
.selo.conferir { background: var(--postit); color: var(--tinta); border: 1px solid var(--postit-borda); }
.barra { display: inline-block; width: 80px; height: 10px; background: var(--linha); border-radius: 5px; position: relative; overflow: hidden; vertical-align: middle; }
.barra::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: var(--revisao); }
.codigo { background: var(--papel2); border: 1px solid var(--linha); padding: 10px; border-radius: 4px; overflow: auto; font-size: .85rem; white-space: pre-wrap; word-break: break-word; }
.zona-drop { border: 3px dashed var(--linha-forte); border-radius: var(--raio); padding: 26px; text-align: center; }
.zona-drop.sobre { background: var(--caneta-clara); border-color: var(--caneta); }

/* mural */
.mural { background: var(--tinta); color: #fff; padding: 14px; border-radius: 6px; }
.mural-topo { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.mural-topo h2 { color: #fff; display: flex; gap: 8px; align-items: center; margin: 0; }
.faixa { background: var(--papel); color: var(--tinta); border-radius: 3px; padding: 8px 12px; margin-bottom: 5px; }
.faixa header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.faixa header small { color: var(--tinta2); }
.faixa.m7 { background: var(--postit); }
.faixa.m0 { background: #d6dae2; }
.fichas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.fichas > span { background: #fff; border: 1px solid var(--linha); border-radius: 999px; padding: 3px 10px; font-weight: 600; font-size: .9rem; }
.fichas > span i { font-style: normal; color: #8a6500; margin-left: 4px; }
.fichas .vazia { background: transparent; border: 0; color: var(--tinta2); font-weight: 400; }
.mural:fullscreen { overflow: auto; font-size: 1.3rem; }

/* ---------- reduzir movimento ---------- */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
html.menos-movimento *, html.menos-movimento *::before, html.menos-movimento *::after { animation: none !important; transition: none !important; }

/* ---------- impressão (revisão dos slides) ---------- */
@media print {
  #topo, #menu, .abas, .no-print, #prof-sair, .row > .chip { display: none !important; }
  body { background: #fff; }
  .painel { box-shadow: none; border: 0; padding: 0; }
  .casca { padding: 0; }
}

/* ---------- celular: cabeçalho e HUD mais baixos ---------- */
@media (max-width: 600px) {
  .painel-elev { display: none; }
  #topo { flex-wrap: nowrap; }
  #topo .marca b { font-size: .95rem; }
  #topo .cx { padding: 0 4px; }
  .icobtn { width: 40px; height: 40px; }
  .hud .medidores { display: none; }
  .hud { gap: 6px 8px; }
  .hud .btn.mini { padding: 4px 8px; }
  .enunciado { padding: 14px; }
  .acoes-exec .btn { width: 100%; }
}
@media (max-width: 430px) { #topo .marca div { display: none; } #topo { gap: 4px; padding: 6px 8px; } }

/* ---------- cobertura no elevador ---------- */
.pavimento.cobertura { display: flex; align-items: center; gap: 8px; font-weight: 700; min-height: 52px; }

// confere se parece nome completo; devolve o nome arrumado (Maiúsculas Iniciais)
function validarNome(bruto) {
  const limpo = String(bruto || '').replace(/\s+/g, ' ').trim();
  if (!limpo) return { ok: false, msg: 'Escreva seu nome completo.' };
  if (/\d/.test(limpo)) return { ok: false, msg: 'Nome não tem número. Escreva só o seu nome completo.' };
  if (!/^[\p{L}' -]+$/u.test(limpo)) return { ok: false, msg: 'Use só letras no nome (sem símbolos, pontos ou emojis).' };
  const partes = limpo.split(' ').filter(Boolean);
  const nucleo = partes.filter(p => !PARTICULAS.has(normTxt(p)));
  if (nucleo.length < 2) return { ok: false, msg: 'Escreva o nome COMPLETO: nome e sobrenome, como está na chamada.' };
  for (const p of nucleo) {
    const n = normTxt(p).replace(/ /g, '');
    if (n.length < 2) return { ok: false, msg: `"${p}" não parece parte de um nome. Escreva nome e sobrenome por extenso, sem abreviar.` };
    if (!/[aeiouy]/.test(n)) return { ok: false, msg: `"${p}" não parece um nome de verdade.` };
    if (/(.)\1\1/.test(n)) return { ok: false, msg: `"${p}" tem letra repetida demais. Confira o nome.` };
    if (NOMES_FALSOS.has(n)) return { ok: false, msg: `"${p}" não é nome. Escreva o seu nome completo de verdade.` };
  }
  if (limpo.length > 60) return { ok: false, msg: 'Nome grande demais (máximo 60 letras).' };
  const arrumado = partes.map((p, i) => {
    const low = p.toLocaleLowerCase('pt-BR');
    if (i > 0 && PARTICULAS.has(normTxt(p))) return low;
    return low.replace(/(^|[-'])(\p{L})/gu, (m, a, c) => a + c.toLocaleUpperCase('pt-BR'));
  }).join(' ');
  return { ok: true, nome: arrumado };
}

function carregarPerfil(id) {
  const raw = store.get(perfilKey(id));

// ---------- código de conferência (Crockford Base32) ----------
function empacotar(save, quando) {
  const b = baseOficial(save);
  if (save.oficial) quando = save.oficial.fechadoEm;
  const est = [];
  for (let n = 1; n <= 6; n++) est.push((b.andares[n] && b.andares[n].estrelas) || 0);
  const minutos = Math.max(0, Math.min((1 << 24) - 1, Math.floor((quando || Date.now()) / 60000 - EPOCH_MIN)));
  const campos = [
    [SAVE_FMT, 3], [nota10(save), 7],
    ...est.map(e => [e, 2]),
    [totalEstrelas(b) === 18 ? 1 : 0, 1],
    [Math.min(7, b.restauracoes || 0), 3],
    [b.hack ? 1 : 0, 1],
    [b.teste ? 1 : 0, 1],
    [Math.min(63, b.saidasTotal || 0), 6],
    [Math.min(7, b.moedasGanhas || 0), 3],
    [minutos, 24],
  ];
  let v = 0n;
  for (const [val, bits] of campos) v = (v << BigInt(bits)) | BigInt(val);
  return v;
}

  const larguras = [3, 7, 2, 2, 2, 2, 2, 2, 1, 3, 1, 1, 6, 3, 24];
  const total = larguras.reduce((a, b) => a + b, 0);
  const vals = [];
  let shift = BigInt(total);
  for (const w of larguras) { shift -= BigInt(w); vals.push(Number((v >> shift) & ((1n << BigInt(w)) - 1n))); }
  const [fmt, nota, e1, e2, e3, e4, e5, e6, bonus, rest, hack, teste, saidas, moedas, minutos] = vals;
  return { fmt, nota10: nota, estrelas: [e1, e2, e3, e4, e5, e6], bonus, restauracoes: rest, hack, teste, saidas, moedas, quando: new Date((minutos + EPOCH_MIN) * 60000) };
}

  if (c.length !== 18) return { ok: false, motivo: 'CÓDIGO INVÁLIDO (tamanho)' };
  const payload = c.slice(0, 13), cs = c.slice(13);
  const v = b32Decode(payload);
  if (v === null || b32Decode(cs) === null) return { ok: false, motivo: 'CÓDIGO INVÁLIDO (caracteres)' };
  const dados = desempacotar(v);
  if (dados.fmt === 2) return { ok: false, motivo: 'CÓDIGO DO DUNGEON DO PYTHON (outro jogo)' };
  if (dados.fmt !== SAVE_FMT) return { ok: false, motivo: 'CÓDIGO DE VERSÃO ANTIGA DO JOGO' };
  if (checksum(id, payload) !== cs) return { ok: false, motivo: 'NÃO CONFERE com nome/número/escola/turma', dados };
  return { ok: true, dados };
}

// ---------- PNG com chunk tEXt ----------
function pngInserirTexto(bytes, chave, texto) {
  const kb = new TextEncoder().encode(chave);
  const tb = new Uint8Array(texto.length);
  for (let i = 0; i < texto.length; i++) tb[i] = texto.charCodeAt(i) & 0xff;

  dados.set(kb, 0); dados[kb.length] = 0; dados.set(tb, kb.length + 1);

  const crcIn = new Uint8Array(4 + dados.length); crcIn.set(tipo, 0); crcIn.set(dados, 4);
  const crc = crc32(crcIn);

  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, dados.length); chunk.set(tipo, 4); chunk.set(dados, 8); dv.setUint32(8 + dados.length, crc);
  // insere antes do IEND
  let pos = 8;
  const bdv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  while (pos < bytes.length) {
    const len = bdv.getUint32(pos);
    const t = String.fromCharCode(bytes[pos + 4], bytes[pos + 5], bytes[pos + 6], bytes[pos + 7]);
    if (t === 'IEND') break;
    pos += 12 + len;
  }
  const out = new Uint8Array(bytes.length + chunk.length);
  out.set(bytes.subarray(0, pos), 0); out.set(chunk, pos); out.set(bytes.subarray(pos), pos + chunk.length);
  return out;
}
function pngLerTexto(bytes, chave) {
  const assin = [137, 80, 78, 71, 13, 10, 26, 10];
  for (let i = 0; i < 8; i++) if (bytes[i] !== assin[i]) return { erro: 'não é um arquivo PNG' };
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let pos = 8;
  while (pos + 12 <= bytes.length) {
    const len = dv.getUint32(pos);
    const t = String.fromCharCode(bytes[pos + 4], bytes[pos + 5], bytes[pos + 6], bytes[pos + 7]);
    if (t === 'tEXt') {
      const dados = bytes.subarray(pos + 8, pos + 8 + len);
      const crcCalc = crc32(bytes.subarray(pos + 4, pos + 8 + len));
      const crcArq = dv.getUint32(pos + 8 + len);
      const z = dados.indexOf(0);
      const k = new TextDecoder().decode(dados.subarray(0, z));
      if (k === chave) {
        if (crcCalc !== crcArq) return { erro: 'o bloco de dados do PNG está corrompido (CRC)' };
        let s = '';
        for (let i = z + 1; i < dados.length; i++) s += String.fromCharCode(dados[i]);
        return { texto: s };
      }
    }
    if (t === 'IEND') break;

// O botão Ouvir só funciona onde existe voz em português. Isso depende do navegador E do aparelho,
// então o jogo testa na hora (não adivinha pelo nome do navegador).
function vozPt() {
  try {
    const vozes = (speechSynthesis.getVoices() || []).filter(v => /^pt([-_]|$)/i.test(v.lang));
    const usaveis = navigator.onLine === false ? vozes.filter(v => v.localService) : vozes;
    return usaveis.find(v => /BR/i.test(v.lang)) || usaveis[0] || null;
  } catch (e) { return null; }
}
function htmlBtnOuvir(attrs, rotulo, mini) {
  const ok = !!vozPt();
  return `<button class="btn ${mini ? 'mini' : ''} btn-ouvir ${ok ? '' : 'sem-voz'}" ${attrs} data-rotulo="${escHtml(rotulo)}" title="${ok ? 'Ler em voz alta' : 'Leitura em voz alta indisponível neste navegador'}">${ok ? ico('som') + ' ' + escHtml(rotulo) : ico('mudo') + ' Sem voz neste navegador'}</button>`;
}
function atualizarBotoesOuvir() {
  const ok = !!vozPt();
  document.querySelectorAll('.btn-ouvir').forEach(b => {
    b.classList.toggle('sem-voz', !ok);
    b.title = ok ? 'Ler em voz alta' : 'Leitura em voz alta indisponível neste navegador';
    b.innerHTML = ok ? ico('som') + ' ' + escHtml(b.dataset.rotulo || 'Ouvir') : ico('mudo') + ' Sem voz neste navegador';
  });
}

let falando = null;
function falar(texto, alvo) {
  try {
    const v = ('speechSynthesis' in window) ? vozPt() : null;
    if (!v) { infoVoz(); return; }
    speechSynthesis.cancel();
    if (falando) falando.classList.remove('lendo');
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = v.lang; u.rate = AJ.velocidade || 0.95;
    try { u.voice = v; } catch (e) { /* alguns navegadores só aceitam o idioma */ }
    if (alvo) { falando = alvo; alvo.classList.add('lendo'); u.onend = () => alvo.classList.remove('lendo'); }
    u.onerror = (ev) => { if (alvo) alvo.classList.remove('lendo'); if (ev && ev.error !== 'interrupted' && ev.error !== 'canceled') infoVoz(); };
    speechSynthesis.speak(u);
  } catch (e) { infoVoz(); }
}
function calar() { try { speechSynthesis.cancel(); } catch (e) { } if (falando) { falando.classList.remove('lendo'); falando = null; } }
try {
  if ('speechSynthesis' in window) {
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener('voiceschanged', atualizarBotoesOuvir);
  }
  window.addEventListener('online', atualizarBotoesOuvir);
  window.addEventListener('offline', atualizarBotoesOuvir);
} catch (e) { }

// ===================== TIPOS DE DESAFIO =====================
// Cada tipo sabe: começar (estado inicial), desenhar, conferir, montar o gabarito (QA),
// usar o Marca-texto e explicar o acerto ("Por que funcionou").
// Conferir devolve: { status: 'incompleto' | 'ok' | 'falhou' | 'avanca', perda: 1 | 0.5, msg, pista }
const TIPOS = {};

// ---------- utilidades comuns ----------
function htmlTexto(t) { return escHtml(t).replace(/\n/g, '<br>'); }
function rngDesafio(r, d, extra) {
  const quem = S ? idChave(S.id) : 'anon';
  return rngSemente(`${quem}|${d.id}|${(S && S.tentativas && S.tentativas[d.andar]) || 0}|${extra || ''}`);
}

// ---------- CLASSIFICAR: cartões em colunas ----------
TIPOS.classificar = {
  rotulo: 'Classificar',
  iniciar(d, cen, rng) {
    const m = { ordem: embaralharCom(cen.cartoes.map((_, i) => i), rng), pos: {}, fix: {}, ex: {}, sel: null };
    cen.cartoes.forEach((c, i) => { if (c.exemplo) { m.pos[i] = c.col; m.fix[i] = true; m.ex[i] = true; } });
    return m;
  },
  render(d, cen, m) {
    const naCaixa = m.ordem.filter(i => !m.pos[i]);
    const it = d.item || { um: 'recado', uns: 'recados', Uns: 'Recados', o: 'o', todos: 'Todos os recados estão' };
    const cartao = (i, onde) => {
      const c = cen.cartoes[i];
      const sel = m.sel === i;
      return `<button class="cartao ${sel ? 'sel' : ''} ${m.fix[i] ? 'fixo' : ''}" data-acao="cls-sel" data-c="${i}" aria-pressed="${sel}" ${m.fix[i] ? 'disabled' : ''}
        aria-label="${(m.ex && m.ex[i]) ? 'Exemplo: ' : ''}${escHtml(c.t)}${onde ? ', está em ' + escHtml(d.colunas.find(x => x.id === onde).nome) : ', ainda sem coluna'}">${(m.ex && m.ex[i]) ? '<span class="ex-tag">Exemplo</span> ' : (m.fix[i] ? ico('marca') + ' ' : '')}${escHtml(c.t)}</button>`;
    };
    return `<div class="cls ${m.sel !== null ? 'escolhendo' : ''}">
      <div class="cls-caixa" data-zona="caixa">
        <div class="painel-titulo">${ico('bandeja')} ${it.Uns} <span class="small">${naCaixa.length ? `(${naCaixa.length} sem coluna)` : '(todos distribuídos)'}</span>
          ${m.sel !== null && m.pos[m.sel] ? '<button class="btn mini" data-acao="cls-devolver">Devolver para cá</button>' : ''}</div>
        <div class="cls-cartoes">${naCaixa.map(i => cartao(i, null)).join('') || `<p class="vazio">${it.todos} numa coluna. Confira e aperte Conferir.</p>`}</div>
      </div>
      <p class="cls-ajuda small" aria-live="polite">${m.sel !== null ? `Agora toque na coluna certa para ess${it.o === 'a' ? 'a' : 'e'} ${it.um}.` : `Toque num${it.o === 'a' ? 'a' : ''} ${it.um} e depois na coluna. No computador, também dá para arrastar.`}</p>
      <div class="cls-cols cols-${d.colunas.length}">
        ${d.colunas.map(col => `<div class="coluna" data-zona="${col.id}">
          <button class="col-cab" data-acao="cls-por" data-col="${col.id}" ${m.sel === null ? 'tabindex="-1"' : ''}><b>${escHtml(col.nome)}</b><span>${escHtml(col.desc)}</span></button>
          <div class="col-corpo">${m.ordem.filter(i => m.pos[i] === col.id).map(i => cartao(i, col.id)).join('')}</div>
        </div>`).join('')}
      </div></div>`;
  },
  conferir(d, cen, m) {
    const faltam = cen.cartoes.filter((_, i) => !m.pos[i]).length;
    const it = d.item || { um: 'recado', uns: 'recados' };
    if (faltam) return { status: 'incompleto', msg: `Ainda ${faltam === 1 ? 'falta 1 ' + it.um : `faltam ${faltam} ${it.uns}`} sem coluna. Nenhuma chance foi perdida.` };
    const errados = m.ordem.filter(i => m.pos[i] !== cen.cartoes[i].col);
    if (!errados.length) return { status: 'ok' };
    const c = cen.cartoes[errados[0]];
    return { status: 'falhou', perda: 1, erradosIdx: errados,
      msg: `${errados.length === 1 ? `1 ${it.um} está` : `${errados.length} ${it.uns} estão`} na coluna errada.`,
      pista: `Sobre ${it.o} ${it.um} "${c.t}": ${c.pista}` };
  },
  gabarito(d, cen, m) { cen.cartoes.forEach((c, i) => { m.pos[i] = c.col; }); },
  variantesErradas(d, cen) {
    // cada cartão numa coluna errada precisa reprovar
    const out = [];
    cen.cartoes.forEach((c, i) => { if (c.exemplo) return; d.colunas.filter(col => col.id !== c.col).forEach(col => {
      const m = this.iniciar(d, cen, rngSemente('qa')); this.gabarito(d, cen, m); m.pos[i] = col.id; out.push({ m, desc: `cartão ${i + 1} em ${col.nome}` });
    }); });
    return out;
  },
  marcar(d, cen, m) {
    const alvo = m.ordem.find(i => m.pos[i] !== cen.cartoes[i].col && !m.fix[i]);
    if (alvo === undefined) return `${(d.item || { todos: 'Todos os recados estão' }).todos} no lugar certo.`;
    m.pos[alvo] = cen.cartoes[alvo].col; m.fix[alvo] = true; if (m.sel === alvo) m.sel = null;
    return null;
  },
  porque(d, cen) {
    return `<ul class="porque">${cen.cartoes.map(c => `<li><span class="etq">${escHtml(d.colunas.find(x => x.id === c.col).nome)}</span><b>${escHtml(c.t)}</b><br>${escHtml(c.porque)}</li>`).join('')}</ul>`;
  },
};

// ---------- ESCOLHER: melhor versão + motivo ----------
TIPOS.escolher = {
  rotulo: 'Escolher',
  iniciar(d, cen, rng) {
    return { ordOp: embaralharCom(cen.opcoes.map((_, i) => i), rng), ordMot: embaralharCom(cen.motivos.map((_, i) => i), rng),
      fase: 'versao', sel: null, selMot: null, tentadas: [], tentMot: [], fora: [], foraMot: [] };
  },
  render(d, cen, m) {
    if (m.fase === 'motivo') {
      const certa = cen.opcoes.findIndex(o => o.certa);
      return `<div class="esc">
        <div class="esc-feita"><span class="carimbo-mini">${ico('ok')} Versão certa</span><p>${escHtml(cen.opcoes[certa].t)}</p></div>
        <h3 class="esc-pergunta">Agora, por que essa é a melhor forma?</h3>
        <div class="esc-ops" role="radiogroup" aria-label="Motivos">${m.ordMot.map(i => {
          const fora = m.tentMot.includes(i) || m.foraMot.includes(i);
          return `<button class="opcao motivo ${m.selMot === i ? 'sel' : ''} ${fora ? 'fora' : ''}" role="radio" aria-checked="${m.selMot === i}" data-acao="esc-mot" data-i="${i}" ${fora ? 'disabled' : ''}>${escHtml(cen.motivos[i].t)}</button>`;
        }).join('')}</div></div>`;
    }
    return `<div class="esc">${cen.cotacao ? htmlCotacao(cen.cotacao) : ''}<div class="esc-ops" role="radiogroup" aria-label="Opções">${m.ordOp.map((i, k) => {
      const fora = m.tentadas.includes(i) || m.fora.includes(i);
      return `<button class="opcao ${m.sel === i ? 'sel' : ''} ${fora ? 'fora' : ''}" role="radio" aria-checked="${m.sel === i}" data-acao="esc-sel" data-i="${i}" ${fora ? 'disabled' : ''}>
        <span class="letra" aria-hidden="true">${'ABCD'[k]}</span><span>${escHtml(cen.opcoes[i].t)}</span>${fora ? `<span class="small">${m.tentadas.includes(i) ? '(já tentada)' : '(riscada pelo marca-texto)'}</span>` : ''}</button>`;
    }).join('')}</div></div>`;
  },
  conferir(d, cen, m) {
    if (m.fase === 'versao') {
      if (m.sel === null) return { status: 'incompleto', msg: 'Escolha uma das opções antes de conferir. Nenhuma chance foi perdida.' };
      const o = cen.opcoes[m.sel];
      if (o.certa) { m.fase = 'motivo'; return { status: 'avanca', msg: 'Boa escolha! Agora diga o motivo.' }; }
      m.tentadas.push(m.sel); m.sel = null;
      return { status: 'falhou', perda: 1, msg: 'Essa forma deixa um problema no caminho.', pista: o.pista };
    }
    if (m.selMot === null) return { status: 'incompleto', msg: 'Escolha um motivo antes de conferir. Nenhuma chance foi perdida.' };
    const mo = cen.motivos[m.selMot];
    if (mo.certo) return { status: 'ok' };
    m.tentMot.push(m.selMot); m.selMot = null;
    return { status: 'falhou', perda: 0.5, msg: 'A versão estava certa, mas o motivo não. Custa meia chance.', pista: mo.pista };
  },
  gabarito(d, cen, m) { m.fase = 'motivo'; m.sel = cen.opcoes.findIndex(o => o.certa); m.selMot = cen.motivos.findIndex(o => o.certo); },
  variantesErradas(d, cen) {
    const out = [];
    cen.opcoes.forEach((o, i) => { if (!o.certa) { const m = this.iniciar(d, cen, rngSemente('qa')); m.sel = i; out.push({ m, desc: `opção errada ${i + 1}` }); } });
    cen.motivos.forEach((o, i) => { if (!o.certo) { const m = this.iniciar(d, cen, rngSemente('qa')); this.gabarito(d, cen, m); m.selMot = i; out.push({ m, desc: `motivo errado ${i + 1}` }); } });
    return out;
  },
  marcar(d, cen, m) {
    if (m.fase === 'versao') {
      const erradas = m.ordOp.filter(i => !cen.opcoes[i].certa && !m.tentadas.includes(i) && !m.fora.includes(i));
      if (!erradas.length) return 'Só sobrou a opção certa.';
      m.fora.push(...erradas.slice(0, 2)); if (m.fora.includes(m.sel)) m.sel = null; return null;
    }
    const erradas = m.ordMot.filter(i => !cen.motivos[i].certo && !m.tentMot.includes(i) && !m.foraMot.includes(i));
    if (!erradas.length) return 'Só sobrou o motivo certo.';
    m.foraMot.push(erradas[0]); if (m.foraMot.includes(m.selMot)) m.selMot = null; return null;
  },
  porque(d, cen) {
    const o = cen.opcoes.find(x => x.certa), mo = cen.motivos.find(x => x.certo);
    return `<p><b>${escHtml(o.t)}</b></p><p>${escHtml(o.porque)}</p><p class="small"><b>Motivo:</b> ${escHtml(mo.t)}</p>
      <details><summary>E as outras opções?</summary><ul>${cen.opcoes.filter(x => !x.certa).map(x => `<li><b>${escHtml(x.t)}</b><br>${escHtml(x.pista)}</li>`).join('')}</ul></details>`;
  },
};

function brl(v) { return 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function totalCotacao(c, f) { return Math.round((f.unit * c.qtd + f.frete) * 100) / 100; }
function htmlCotacao(c) {
  return `<div class="cotacao doc"><div class="doc-cab">${ico('lista')} ${c.qtd} ${escHtml(c.item)} · prazo máximo: <b>${c.prazoMax} dias</b></div>
    <div class="cot-tab" role="table" aria-label="Cotações recebidas">
      <div class="cot-lin cot-cab" role="row"><span role="columnheader">Fornecedor</span><span role="columnheader">Preço da unidade</span><span role="columnheader">Frete</span><span role="columnheader">Entrega</span></div>
      ${c.fornecedores.map(f => `<div class="cot-lin" role="row"><span role="cell"><b>${escHtml(f.nome)}</b></span><span role="cell" data-r="Unidade">${brl(f.unit)}</span><span role="cell" data-r="Frete">${brl(f.frete)}</span><span role="cell" data-r="Entrega">${f.prazo} dias</span></div>`).join('')}
    </div><p class="small cot-conta">Custo total = preço da unidade × ${c.qtd} + frete</p></div>`;
}

// ---------- INSPECIONAR: marcar trechos com problema + o que falta ----------
TIPOS.inspecionar = {
  rotulo: 'Revisar',
  iniciar(d, cen, rng) { return { marc: {}, faltas: {}, fix: {}, ordFaltas: embaralharCom(cen.faltas.map((_, i) => i), rng) }; },
  render(d, cen, m) {
    let corpo = '';
    let linhaAberta = false;
    cen.partes.forEach((p, i) => {
      const t = p.t.replace(/^\n/, '');
      const btn = `<button class="trecho ${m.marc[i] ? 'marcado' : ''} ${m.fix[i] ? 'fixo' : ''}" data-acao="insp-marca" data-i="${i}" aria-pressed="${!!m.marc[i]}" ${m.fix[i] ? 'disabled' : ''}>${escHtml(t)}</button>`;
      if (cen.doc === 'convite') {
        if (p.rot) { if (linhaAberta) corpo += '</dd>'; corpo += `<dt>${escHtml(p.rot)}</dt><dd>`; linhaAberta = true; }
        corpo += btn;
      } else {
        corpo += btn;
      }
    });
    if (linhaAberta) corpo += '</dd>';
    const doc = cen.doc === 'convite'
      ? `<div class="doc doc-convite"><div class="doc-cab">${ico('agenda')} Convite de reunião <span class="small">(rascunho)</span></div><dl>${corpo}</dl></div>`
      : `<div class="doc doc-msg"><div class="doc-cab">${ico('carta')} Para: ${escHtml(cen.para || '')}</div><p class="doc-texto">${corpo}</p></div>`;
    const nMarc = Object.values(m.marc).filter(Boolean).length;
    return `<div class="insp">
      <p class="small insp-ajuda">Cada ${cen.doc === 'convite' ? 'linha' : 'frase'} tem um contorno. Toque nas que têm problema para marcar. Toque de novo para desmarcar. <span aria-live="polite">(${nMarc} marcado${nMarc === 1 ? '' : 's'})</span></p>
      ${doc}
      <h3 class="insp-sub">${ico('lista')} ${escHtml(cen.rotuloFaltas || 'O que está faltando?')}</h3>
      <p class="small">${escHtml(cen.ajudaFaltas || 'Marque só o que falta de verdade. Pode ser mais de um.')}</p>
      <div class="faltas">${m.ordFaltas.map(i => `<button class="falta ${m.faltas[i] ? 'sel' : ''}" data-acao="insp-falta" data-i="${i}" aria-pressed="${!!m.faltas[i]}"><span class="caixinha" aria-hidden="true">${m.faltas[i] ? '✓' : ''}</span>${escHtml(cen.faltas[i].t)}</button>`).join('')}</div>
    </div>`;
  },
  conferir(d, cen, m) {
    const nMarc = Object.values(m.marc).filter(Boolean).length, nF = Object.values(m.faltas).filter(Boolean).length;
    if (!nMarc && !nF) return { status: 'incompleto', msg: 'Marque os trechos com problema e o que está faltando antes de conferir. Nenhuma chance foi perdida.' };
    const semMarcar = cen.partes.filter((p, i) => p.prob && !m.marc[i]).length;
    const marcadosOk = cen.partes.filter((p, i) => !p.prob && m.marc[i]).length;
    const faltasErradas = cen.faltas.filter((f, i) => !!f.falta !== !!m.faltas[i]).length;
    if (!semMarcar && !marcadosOk && !faltasErradas) return { status: 'ok' };
    const partes = [];
    if (semMarcar) partes.push(`${semMarcar === 1 ? 'ainda tem 1 trecho' : `ainda tem ${semMarcar} trechos`} com problema sem marcar`);
    if (marcadosOk) partes.push(`${marcadosOk === 1 ? '1 trecho marcado está' : marcadosOk + ' trechos marcados estão'} adequado${marcadosOk === 1 ? '' : 's'}`);
    if (faltasErradas) partes.push(`a lista do que falta tem ${faltasErradas === 1 ? '1 item trocado' : faltasErradas + ' itens trocados'}`);
    let pista;
    if (semMarcar) pista = 'Leia a mensagem como se você fosse quem vai recebê-la. Onde você ficaria confuso, ofendido ou sem saber o que fazer?';
    else if (marcadosOk) pista = 'Um trecho simples e claro não é problema. Problema é o que está vago, informal demais, agressivo, errado ou sobrando.';
    else pista = cen.rotuloFaltas ? 'Na lista de baixo, marque só as atitudes seguras: as que não clicam, não pagam e não respondem ao golpista.' : 'Na lista, só conta o que falta de verdade. Confira se o item já está no texto ou se ele nem deveria estar lá.';
    return { status: 'falhou', perda: 1, msg: partes.join('; ') + '.', pista };
  },
  gabarito(d, cen, m) { cen.partes.forEach((p, i) => { if (p.prob) m.marc[i] = true; }); cen.faltas.forEach((f, i) => { if (f.falta) m.faltas[i] = true; }); },
  variantesErradas(d, cen) {
    const out = [];
    cen.partes.forEach((p, i) => { const m = this.iniciar(d, cen, rngSemente('qa')); this.gabarito(d, cen, m); m.marc[i] = !p.prob; out.push({ m, desc: `trecho ${i + 1} trocado` }); });
    cen.faltas.forEach((f, i) => { const m = this.iniciar(d, cen, rngSemente('qa')); this.gabarito(d, cen, m); m.faltas[i] = !f.falta; out.push({ m, desc: `falta ${i + 1} trocada` }); });
    return out;
  },
  marcar(d, cen, m) {
    const alvo = cen.partes.findIndex((p, i) => p.prob && !m.marc[i]);
    if (alvo < 0) return 'Todos os trechos com problema já estão marcados.';
    m.marc[alvo] = true; m.fix[alvo] = true; return null;
  },
  porque(d, cen) {
    return `<ul class="porque">${cen.partes.filter(p => p.prob).map(p => `<li><span class="etq ruim">Problema</span><b>${escHtml(p.t.trim())}</b><br>${escHtml(p.porque)}</li>`).join('')}
      ${cen.faltas.filter(f => f.falta).map(f => `<li><span class="etq">${cen.rotuloFaltas ? 'Certo fazer' : 'Faltava'}</span><b>${escHtml(f.t)}</b><br>${escHtml(f.porque)}</li>`).join('')}</ul>
      <details><summary>${cen.rotuloFaltas ? 'E as atitudes erradas?' : 'E os itens que não faltavam?'}</summary><ul>${cen.faltas.filter(f => !f.falta).map(f => `<li><b>${escHtml(f.t)}</b>: ${escHtml(f.porque)}</li>`).join('')}</ul></details>`;
  },
};

// ---------- MONTAR: blocos na ordem, com peças falsas ----------
TIPOS.montar = {
  rotulo: 'Montar',
  iniciar(d, cen, rng) {
    const todos = [...cen.blocos.map((_, i) => 'c' + i), ...cen.distratores.map((_, i) => 'd' + i)];
    return { area: [], pool: embaralharCom(todos, rng), removidos: [] };
  },
  texto(cen, bid) { const i = Number(bid.slice(1)); return bid[0] === 'c' ? cen.blocos[i].t : cen.distratores[i].t; },
  render(d, cen, m) {
    const pool = m.pool.filter(b => !m.area.includes(b) && !m.removidos.includes(b));
    return `<div class="mnt">
      <div class="mnt-area">
        <div class="painel-titulo">${ico('carta')} ${escHtml(d.rotuloMontar || 'Seu comunicado')} <span class="small">(${m.area.length} de ${cen.blocos.length} blocos)</span></div>
        <ol class="doc doc-montado" id="area" aria-label="${escHtml(d.rotuloMontar || 'Comunicado montado')}">
          ${m.area.length ? m.area.map((b, i) => `<li class="bloco" data-bid="${b}" data-onde="area" data-i="${i}">
            <span class="alca" aria-hidden="true">⠿</span><span class="txt">${escHtml(this.texto(cen, b))}</span>
            <span class="ctrl"><button data-acao="mnt-mover" data-i="${i}" data-d="-1" aria-label="Subir" ${i === 0 ? 'disabled' : ''}>↑</button><button data-acao="mnt-mover" data-i="${i}" data-d="1" aria-label="Descer" ${i === m.area.length - 1 ? 'disabled' : ''}>↓</button><button data-acao="mnt-tirar" data-i="${i}" aria-label="Devolver para a caixa">✕</button></span></li>`).join('')
            : '<li class="vazio">Toque nos blocos da caixa para trazer para cá, na ordem.</li>'}
        </ol>
      </div>
      <div class="mnt-pool">
        <div class="painel-titulo">${ico('bandeja')} Caixa de blocos <span class="small">(${cen.distratores.length - m.removidos.length > 0 ? `${cen.distratores.length - m.removidos.length} peças falsas: não use` : 'peças falsas já retiradas'})</span></div>
        <div class="pool" id="pool">${pool.map(b => `<button class="bloco solto" data-bid="${b}" data-onde="pool" data-acao="mnt-add"><span class="alca" aria-hidden="true">⠿</span><span class="txt">${escHtml(this.texto(cen, b))}</span></button>`).join('') || '<p class="vazio">Todos os blocos estão lá em cima.</p>'}</div>
      </div></div>`;
  },
  conferir(d, cen, m) {
    if (m.area.length < cen.blocos.length) return { status: 'incompleto', msg: `Sua montagem tem ${m.area.length} de ${cen.blocos.length} blocos. Nenhuma chance foi perdida.` };
    const falsa = m.area.find(b => b[0] === 'd');
    if (falsa) return { status: 'falhou', perda: 1, msg: 'Tem peça falsa na montagem.', pista: cen.distratores[Number(falsa.slice(1))].pista };
    const area = m.area.slice();
    (cen.trocaveis || []).forEach(([i, j]) => { if (area[i] === 'c' + j && area[j] === 'c' + i) { area[i] = 'c' + i; area[j] = 'c' + j; } });
    const k = area.findIndex((b, i) => b !== 'c' + i);
    if (k < 0) return { status: 'ok' };
    return { status: 'falhou', perda: 1, msg: `As peças são as certas, mas a ordem quebra no ${k + 1}º bloco.`,
      pista: d.pistaOrdem || 'Leia de cima para baixo como quem recebe: primeiro a saudação, depois o que aconteceu e por que você escreve, os dados, o que vai ser feito, a cordialidade e, por último, a assinatura.' };
  },
  gabarito(d, cen, m) { m.area = cen.blocos.map((_, i) => 'c' + i); },
  variantesErradas(d, cen) {
    const out = [];
    cen.distratores.forEach((x, k) => { const m = this.iniciar(d, cen, rngSemente('qa')); this.gabarito(d, cen, m); m.area[x.imita] = 'd' + k; out.push({ m, desc: `peça falsa ${k + 1}` }); });
    const livre = (i, j) => (cen.trocaveis || []).some(([a, b]) => (a === i && b === j) || (a === j && b === i));
    for (let i = 0; i + 1 < cen.blocos.length; i++) { if (livre(i, i + 1)) continue; const m = this.iniciar(d, cen, rngSemente('qa')); this.gabarito(d, cen, m); [m.area[i], m.area[i + 1]] = [m.area[i + 1], m.area[i]]; out.push({ m, desc: `troca ${i + 1}↔${i + 2}` }); }
    return out;
  },
  marcar(d, cen, m) {
    const vivos = cen.distratores.map((_, i) => 'd' + i).filter(b => !m.removidos.includes(b));
    if (!vivos.length) return 'As peças falsas já foram retiradas.';
    vivos.forEach(b => { m.removidos.push(b); const ai = m.area.indexOf(b); if (ai >= 0) m.area.splice(ai, 1); });
    return null;
  },
  porque(d, cen) {
    return `<ol class="porque">${cen.blocos.map(b => `<li><span class="etq">${escHtml(b.papel)}</span><b>${escHtml(b.t)}</b><br>${escHtml(b.porque)}</li>`).join('')}</ol>
      <details><summary>Por que as peças falsas não serviam</summary><ul>${cen.distratores.map(x => `<li><b>${escHtml(x.t)}</b><br>${escHtml(x.pista)}</li>`).join('')}</ul></details>`;
  },
};

// QA de um desafio: o gabarito de cada cenário passa e cada variante errada reprova
function qaDesafio(d) {
  const falhas = [];
  const T = TIPOS[d.tipo];
  if (!T) return { id: d.id, ok: false, falhas: ['tipo desconhecido: ' + d.tipo] };
  if (d.id !== 'TUT-01' && d.cenarios.length !== 3) falhas.push(`tem ${d.cenarios.length} cenários (precisa de 3)`);
  d.cenarios.forEach((cen, ci) => {
    const pre = `cenário ${ci + 1}: `;
    const m = T.iniciar(d, cen, rngSemente('qa')); T.gabarito(d, cen, m);
    const r = T.conferir(d, cen, m);
    if (r.status !== 'ok') falhas.push(pre + 'o gabarito não passa (' + r.status + ')');
    for (const v of T.variantesErradas(d, cen)) {
      const rv = T.conferir(d, cen, v.m);
      if (rv.status === 'ok') falhas.push(pre + 'variante errada passou: ' + v.desc);
    }
    if (d.tipo === 'classificar') {
      if (cen.cartoes.filter(c => c.exemplo).length > 1) falhas.push(pre + 'mais de um cartão de exemplo');
      cen.cartoes.forEach((c, i) => { if (!d.colunas.some(x => x.id === c.col)) falhas.push(pre + `cartão ${i + 1} aponta para coluna inexistente`); if (!c.porque || !c.pista) falhas.push(pre + `cartão ${i + 1} sem explicação ou pista`); });
      if (d.id !== 'TUT-01' && new Set(cen.cartoes.map(c => c.col)).size < Math.min(3, d.colunas.length)) falhas.push(pre + 'poucas colunas usadas');
    }
    if (d.tipo === 'escolher') {
      if (cen.opcoes.filter(o => o.certa).length !== 1) falhas.push(pre + 'precisa de exatamente 1 opção certa');
      if (cen.motivos.filter(o => o.certo).length !== 1) falhas.push(pre + 'precisa de exatamente 1 motivo certo');
      cen.opcoes.forEach((o, i) => { if (!o.certa && !o.pista) falhas.push(pre + `opção ${i + 1} sem pista`); if (o.certa && !o.porque) falhas.push(pre + 'opção certa sem explicação'); });
      cen.motivos.forEach((o, i) => { if (!o.certo && !o.pista) falhas.push(pre + `motivo ${i + 1} sem pista`); });
      if (cen.cotacao) {
        const c = cen.cotacao;
        const noPrazo = c.fornecedores.filter(f => f.prazo <= c.prazoMax);
        const melhor = noPrazo.slice().sort((a, b) => totalCotacao(c, a) - totalCotacao(c, b))[0];
        const certa = cen.opcoes.find(o => o.certa);
        if (!melhor || certa.t !== melhor.nome) falhas.push(pre + `cotação: a opção certa deveria ser ${melhor ? melhor.nome : '(nenhum no prazo)'}`);
        if (noPrazo.length > 1 && totalCotacao(c, noPrazo[0]) === totalCotacao(c, noPrazo[1])) falhas.push(pre + 'cotação: empate de total');
        c.fornecedores.forEach(f => { const tot = brl(totalCotacao(c, f)); const op = cen.opcoes.find(o => o.t === f.nome); if (op && f.prazo <= c.prazoMax && !(op.porque || op.pista || '').includes(tot)) falhas.push(pre + `cotação: texto de ${f.nome} não cita o total ${tot}`); });
      }
    }
    if (d.tipo === 'inspecionar') {
      if (!cen.partes.some(p => p.prob) || !cen.partes.some(p => !p.prob)) falhas.push(pre + 'precisa de trechos com e sem problema');
      cen.partes.forEach((p, i) => { if (p.prob && !p.porque) falhas.push(pre + `trecho ${i + 1} sem explicação`); });
      if (!cen.faltas.some(f => f.falta) || !cen.faltas.some(f => !f.falta)) falhas.push(pre + 'a lista do que falta precisa ter itens certos e errados');
    }
    if (d.tipo === 'montar') {
      cen.distratores.forEach((x, k) => { if (!x.pista) falhas.push(pre + `peça falsa ${k + 1} sem pista`); if (x.imita >= cen.blocos.length) falhas.push(pre + `peça falsa ${k + 1} imita bloco inexistente`); });
      cen.blocos.forEach((b, i) => { if (!b.porque || !b.papel) falhas.push(pre + `bloco ${i + 1} sem papel ou explicação`); });
      (cen.trocaveis || []).forEach(([i, j]) => { const m2 = T.iniciar(d, cen, rngSemente('qa')); T.gabarito(d, cen, m2); [m2.area[i], m2.area[j]] = [m2.area[j], m2.area[i]]; if (T.conferir(d, cen, m2).status !== 'ok') falhas.push(pre + `troca permitida ${i + 1}↔${j + 1} reprovou`); });
    }
  });
  if (!Array.isArray(d.dicas) || !d.dicas.length || (d.id !== 'TUT-01' && d.dicas.length < 3)) falhas.push('precisa de 3 dicas');
  if (!d.ficha || !FICHAS.some(f => f.id === d.ficha)) falhas.push('ficha do Manual inexistente: ' + d.ficha);
  return { id: d.id, ok: falhas.length === 0, falhas };
}

// Datas citadas nos textos: o dia da semana precisa bater com 2026 e não pode cair em feriado nacional
const FERIADOS_2026 = { '1-1': 'Confraternização', '3-4': 'Sexta-feira Santa', '21-4': 'Tiradentes', '1-5': 'Dia do Trabalho', '4-6': 'Corpus Christi (ponto facultativo)', '7-9': 'Independência', '12-10': 'Nossa Senhora Aparecida', '2-11': 'Finados', '15-11': 'Proclamação da República', '20-11': 'Consciência Negra', '25-12': 'Natal' };
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const DIAS_SEMANA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
function conferirDatas(texto) {
  const erros = [];
  const re = /(domingo|segunda-feira|terça-feira|quarta-feira|quinta-feira|sexta-feira|sábado),? (?:dia )?(\d{1,2})(?:º)? de (janeiro|fevereiro|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)/gi;
  let mt;
  while ((mt = re.exec(texto))) {
    const dia = Number(mt[2]), mes = MESES.indexOf(mt[3].toLowerCase());
    const dt = new Date(Date.UTC(2026, mes, dia));
    const real = DIAS_SEMANA[dt.getUTCDay()];
    if (real !== mt[1].toLowerCase()) erros.push(`"${mt[0]}": em 2026 esse dia é ${real}`);
    const f = FERIADOS_2026[`${dia}-${mes + 1}`];
    if (f) erros.push(`"${mt[0]}" cai em feriado (${f})`);
  }
  return erros;
}

function svgAvatar(av, cls = '', rotulo = '') {

function desenharAvatarCanvas(g, av, x, y, tam) {
  try {
    g.save(); g.translate(x, y); g.scale(tam / 100, tam / 100);
    g.beginPath(); g.arc(50, 50, 49, 0, Math.PI * 2); g.clip();
    for (const c of camadasAvatar(av)) {
      const p = new Path2D(c.d);
      if (c.fill) { g.fillStyle = c.fill; g.fill(p); }
      else { g.strokeStyle = c.stroke; g.lineWidth = c.w; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(p); }
    }
    g.restore();
  } catch (e) { try { g.restore(); } catch (er) { } }
}

  }
  // falhou
  Som.tocar('erro');
  if (!r.sandbox && S && r.modo === 'valendo') { S.erros[d.id] = (S.erros[d.id] || 0) + 1; }
  let linhaMed = '';
  if (!r.tutorial && d.medidor) {
    const antes = r.med[d.medidor];
    r.med[d.medidor] = Math.max(0, antes - Math.round(25 * res.perda));
    linhaMed = `${MEDIDORES[d.medidor]}: ${antes}% → ${r.med[d.medidor]}%. Erro de comunicação custa ${d.medidor === 'prazo' ? 'tempo' : 'confiança'} para a empresa.`;
  }
  const html = htmlRetornoErro(d, res, linhaMed);
  const morreu = perderChance(r, res.perda || 1);
  if (morreu) return;
  const outrosNormais = r.fila.filter(id => id !== d.id && DES[id].dif !== 'B').length;
  if (res.perda >= 1 && d.dif !== 'B' && outrosNormais > 0) {
    r.fila.shift();
    r.fila.splice(r.fila.length - 1, 0, d.id);
    resultadoPendente = { html: html + `<p class="info">Esse desafio foi para o fim da fila. Você volta nele antes do chefe.</p><div class="row fim-ret"><button class="btn pri" data-acao="proximo">Próximo desafio</button></div>`, bloqueia: true, fixo: true };
    persistir();
    renderCongelado(d);
  } else {
    resultadoPendente = { html };
    persistir();
    renderDesafio();
  }
  const mesa = $('#mesa'); if (mesa && !AJ.movimento) { mesa.classList.add('tremer'); setTimeout(() => mesa.classList.remove('tremer'), 500); }
  const ret = $('#retorno'); if (ret) ret.scrollIntoView({ block: 'nearest', behavior: AJ.movimento ? 'auto' : 'smooth' });
}
function perderChance(r, perda) {
  if (r.tutorial) { r.vidas = Math.max(1, r.vidas - perda); r.perdidos += perda; Som.tocar('coracao'); return false; }
  if (r.sandbox || god()) { toast('Modo professor: a chance não foi perdida.'); return false; }
  r.vidas = Math.round((r.vidas - perda) * 2) / 2; r.perdidos += perda;
  Som.tocar('coracao');
  persistir();
  if (r.vidas <= 0) { morrer('As 3 chances acabaram.'); return true; }
  return false;
}
function resolverAtual(r, d, cen) {
  r.fila.shift();
  r.resolvidos.push(d.id);
  const acabou = r.fila.length === 0;
  const botao = acabou
    ? `<button class="btn pri grande" data-acao="concluir">Concluir o andar</button>`
    : (DES[r.fila[0]].dif === 'B' ? `<button class="btn pri grande" data-acao="proximo">Enfrentar o chefe</button>` : `<button class="btn pri" data-acao="proximo">Próximo desafio</button>`);
  const html = `<div class="didatica ok">${htmlCarimbo('APROVADO')}
    <h3>${ico('ok')} Por que funcionou</h3>
    ${TIPOS[d.tipo].porque(d, cen)}
    <div class="row fim-ret">${htmlBtnOuvir('data-acao="ouvir-retorno"', 'Ouvir', true)}<span class="spacer"></span>${botao}</div></div>`;
  resultadoPendente = { html, bloqueia: true, fixo: true };
  persistir();
  renderCongelado(d);
  const ret = $('#retorno'); if (ret) ret.scrollIntoView({ block: 'start', behavior: AJ.movimento ? 'auto' : 'smooth' });
}
function renderCongelado(d) {
  const r = ctxRun();
  const filaReal = r.fila.slice();
  r.fila.unshift(d.id);
  renderDesafio();
  r.fila = filaReal;
  $$('#mesa button').forEach(b => { b.disabled = true; b.removeAttribute('data-acao'); });

function proximo() {
  resultadoPendente = null;

function concluirAndar() {
  resultadoPendente = null;

  const n = r.andar;
  const A = ANDARES[n];
  const estrelas = estrelasDe(r);
  let msg = '', moeda = false;
  if (god()) S.teste = true;

    S.andares[n] = { estrelas, data: Date.now(), tentativa: S.tentativas[n] || 1 };

  } else if (r.modo === 'horaextra') {

    msg = estrelas > antes ? `${ico('relogio')} A hora extra valeu: de ${antes} para <b>${estrelas}</b> estrelas.` : `${ico('relogio')} Ficou a melhor marca: ${antes} estrela${antes > 1 ? 's' : ''}.`;
