  }
  if (totalEstrelas(S) === 18) S.ct = true;
  S.run = null;
  persistir();
  renderCasca();
  setTema(A.tema);
  Som.tocar('vitoria' + n);
  if (moeda) setTimeout(() => Som.tocar('moeda'), 1800);
  view().innerHTML = `<section class="vitoria">

}

async function usarItem(id) {
  const r = ctxRun(), d = desafioAtual();
  const it = ITENS.find(x => x.id === id);
  if (!r || !d || !it || !(S.inv[id] > 0)) return;
  if (id === 'cafe' && r.vidas >= 3) { toast('Suas chances já estão cheias.'); return; }
  if (!(await confirmar(`Usar <b>${escHtml(it.nome)}</b>?<br><span class="small">${escHtml(it.efeito)}</span>`, 'Usar'))) return;

// ---------- foco / saída de tela ----------
let awayStart = null;
let pausaFocoAte = 0;
function vigiando() {
  if (!S || !S.run || sandbox || god()) return false;
  if (telaAtual !== 'desafio') return false; // elevador, loja, intro, Manual e área do professor são zona segura
  if (Date.now() < pausaFocoAte) return false;
  if (S.run.printp && Date.now() < S.run.printp.ate) return false;
  return true;
}
function saiu() {
  if (!vigiando() || awayStart !== null) return;
  awayStart = Date.now();
  S.run.away = awayStart;
  persistir();
}
function voltou() {
  if (awayStart === null) return;
  const dur = Date.now() - awayStart;
  awayStart = null;
  if (!S || !S.run) return;
  S.run.away = null;
  if (!vigiando()) { persistir(); return; }
  if (dur > 2000) { infracao(`Você ficou ${Math.round(dur / 1000)} s fora da tela.`); return; }
  const agora = Date.now();
  S.run.micro = (S.run.micro || []).filter(t => agora - t < 30000);
  S.run.micro.push(agora);
  if (S.run.micro.length >= 3) { S.run.micro = []; infracao('3 saídas rápidas em menos de 30 segundos.'); return; }
  persistir();
}
function verificarSaidaPendente() {
  if (S && S.run && S.run.away) {
    const passou = Date.now() - S.run.away;
    S.run.away = null;
    if (passou < 10 * 60000 && !god()) S.run.pendente = `A página foi fechada ou recarregada no meio do andar (${Math.round(passou / 1000)} s fora).`;
  }
}
const FRASES_ALIVIO = [
  'A câmera do documentário pegou você olhando para o lado. Volta para a mesa.',
  'A gerente Rosa passou pela sua mesa e viu a cadeira vazia.',
  'O Bento esperou com a carta no bico. Ele não gosta de esperar.',
  'O cliente ligou de novo. Foco no atendimento.',
];
function infracao(motivo) {
  const r = S.run;
  r.saidas++; S.saidasTotal++;
  persistir();
  if (r.saidas >= 5) { morrer('5ª saída de tela. ' + motivo); return; }
  Som.tocar('alarme');
  const ov = document.createElement('div');
  ov.className = 'foco-fundo susto';
  ov.setAttribute('role', 'alertdialog');
  ov.innerHTML = `<div class="foco-caixa"><h1>Saída de tela detectada</h1><p>${escHtml(motivo)}</p></div>`;
  document.body.appendChild(ov);
  setTimeout(() => {
    ov.className = 'foco-fundo alivio';
    const ultimo = r.saidas === 4;
    ov.innerHTML = `<div class="foco-caixa">
      <h1>${ultimo ? 'Último aviso' : `Aviso ${r.saidas} de 4`}</h1>
      <p>${ultimo ? 'Na próxima saída, o progresso deste andar será zerado.' : escHtml(FRASES_ALIVIO[(r.saidas - 1) % FRASES_ALIVIO.length])}</p>
      ${ultimo ? '' : '<p class="small">Na 5ª saída você perde o progresso <b>só deste andar</b>.</p>'}
      <button class="btn pri grande" id="btn-voltei">Voltei</button></div>`;
    ov.querySelector('#btn-voltei').focus();

}
function iniciarVigia() {
  window.addEventListener('blur', saiu);
  window.addEventListener('focus', voltou);
  window.addEventListener('pagehide', saiu);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saiu(); else voltou(); });
  setInterval(() => {
    const b = document.getElementById('badge-print');
    const r = S && S.run;
    if (r && r.printp && Date.now() < r.printp.ate) {
      const s = Math.ceil((r.printp.ate - Date.now()) / 1000);
      b.style.display = 'block';
      b.textContent = `Pode tirar o print · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    } else b.style.display = 'none';
  }, 500);
}

// ---------- palavras-passe de teclado ----------
let bufTeclas = '', bufTempo = 0;
function teclaDigitada(e) {
  const alvo = e.target;
  if (teclaTriagem(e)) return;
  if (e.key === 'Escape' && document.getElementById('modal-fundo') && !document.querySelector('#modal-fundo #f-senha, #modal-fundo #mc-s')) { fecharModal(); return; }
  if (alvo && (alvo.tagName === 'INPUT' || alvo.tagName === 'TEXTAREA' || alvo.tagName === 'SELECT')) return;
  if (e.ctrlKey && e.altKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); abrirProf(); return; }
  if (!/^[a-zA-Z]$/.test(e.key)) return;
  const agora = Date.now();
  if (agora - bufTempo > 2500) bufTeclas = '';
  bufTempo = agora;
  bufTeclas = (bufTeclas + e.key.toUpperCase()).slice(-12);
  if (bufTeclas.endsWith('PRINTP')) { bufTeclas = ''; liberarPrint(); }
  else if (bufTeclas.endsWith('SINAL')) { bufTeclas = ''; sinal(); }
  else if (bufTeclas.endsWith('GODMODE')) { bufTeclas = ''; ativarGod(); }
}
async function liberarPrint() {
  if (!S || !S.run) { toast('Fora de um andar não precisa: pode tirar o print à vontade.'); return; }
  if (S.run.printp.usados >= 3) { toast('Limite de 3 liberações de print nesta tentativa.'); return; }
  if (!(await pedirSenha('Liberar 60 segundos sem penalidade de foco para tirar print.'))) return;
  S.run.printp.usados++;
  S.run.printp.ate = Date.now() + 60000;
  persistir();
  toast('60 segundos liberados para print.');
}
async function sinal() {
  if (!S) return;
  if (!(await pedirSenha('Bateu o sinal: baixar o PNG de checkpoint deste jogador agora.'))) return;
  await baixarPlacar(true);
}
async function ativarGod() {
  if (!(await pedirSenha('Ativar o Modo Professor (chances infinitas, foco livre, todos os andares prontos).'))) return;
  store.sset('god', god() ? '0' : '1');
  toast(god() ? 'Modo Professor ATIVADO nesta aba.' : 'Modo Professor desativado.');
  if (S) mostrar(telaAtual === 'desafio' ? 'desafio' : 'mapa');
}

function canvasParaBytes(canvas) {
  return new Promise((res, rej) => {
    canvas.toBlob(b => {
      if (!b) { rej(new Error('toBlob falhou')); return; }
      b.arrayBuffer().then(ab => res(new Uint8Array(ab)), rej);
    }, 'image/png');
  });
}
function baixarBlob(blob, nome) {
  pausaFocoAte = Date.now() + 6000;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function baixarPlacar(checkpoint, silencioso) {
  try {
    const { canvas } = desenharPlacar(S, checkpoint);
    const bytes = await canvasParaBytes(canvas);
    const comDados = pngInserirTexto(bytes, PNG_KEY, pacotePNG(S, checkpoint));
    const nome = `torre_${checkpoint ? 'checkpoint' : 'cracha'}_${normTxt(S.id.nome).replace(/ /g, '_')}_${S.id.numero}.png`;
    baixarBlob(new Blob([comDados], { type: 'image/png' }), nome);
    if (silencioso) { toast('Crachá salvo: ' + nome, 4000); return; }
    abrirModal(`<h2>${ico('baixar')} ${checkpoint ? 'Checkpoint' : 'Crachá'} baixado</h2>
      <p>O arquivo <b>${escHtml(nome)}</b> foi para a pasta de downloads.</p>
      <ol><li>Envie esse <b>arquivo</b> no Classroom${CFG.formsUrl ? ' ou no formulário' : ''}.</li><li><b>Não</b> mande print da tela nem pelo WhatsApp: eles estragam os dados guardados na imagem.</li>
      ${checkpoint ? '<li>Na próxima aula, use "Já joguei em outro aparelho" para continuar do mesmo desafio.</li>' : ''}</ol>
      <p>Código de conferência: <code>${codigoConferencia(S)}</code></p>
      <div class="row" style="justify-content:flex-end"><button class="btn pri" data-acao="fechar-modal">Ok</button></div>`);
  } catch (e) {
    toast('Não consegui gerar o PNG: ' + e.message, 5000);
  }
}
function escolherArquivo(accept, multiplo) {
  return new Promise(res => {
    pausaFocoAte = Date.now() + 60000;
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept; inp.multiple = !!multiplo;
    inp.onchange = () => { pausaFocoAte = Date.now() + 3000; res(Array.from(inp.files || [])); };

// ---------- arrastar (mouse e toque, via Pointer Events) ----------
// Arrastar é opcional: tocar no item e depois no destino faz o mesmo.
let drag = null;
function iniciarArrasto(e) {
  const el = e.target.closest('.cartao:not([disabled]), .bloco');
  if (!el || !el.closest('#mesa') || el.closest('.congelada') || e.target.closest('.ctrl button')) return;
  if (e.button !== undefined && e.button !== 0) return;
  if (e.pointerType !== 'mouse' && !e.target.closest('.alca')) return; // no toque, só pela alça: o resto da tela continua rolando
  const rect = el.getBoundingClientRect();
  drag = { el, x0: e.clientX, y0: e.clientY, offX: e.clientX - rect.left, offY: e.clientY - rect.top, largura: rect.width, ativo: false, pid: e.pointerId, toque: e.pointerType !== 'mouse' };
}
function moverArrasto(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.ativo) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
    drag.ativo = true;
    const g = drag.el.cloneNode(true);
    g.classList.add('fantasma');
    g.style.width = Math.min(drag.largura, window.innerWidth - 20) + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.el.classList.add('arrastando');
    try { drag.el.setPointerCapture(e.pointerId); } catch (er) { }
  }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.offX) + 'px';
  drag.ghost.style.top = (e.clientY - drag.offY) + 'px';
  $$('.zona-alvo').forEach(x => x.classList.remove('zona-alvo'));
  const z = zonaEm(e.clientX, e.clientY);
  if (z) z.classList.add('zona-alvo');
}
function zonaEm(x, y) {
  if (drag && drag.ghost) drag.ghost.style.display = 'none';
  const sob = document.elementFromPoint(x, y);
  if (drag && drag.ghost) drag.ghost.style.display = '';
  if (!sob) return null;
  return sob.closest('[data-zona], #area, #pool');
}
function soltarArrasto(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const dr = drag; drag = null;
  if (!dr.ativo) return;
  ignorarCliqueAte = Date.now() + 350;
  const z = zonaEm(e.clientX, e.clientY);
  dr.ghost.remove();
  $$('.zona-alvo').forEach(x => x.classList.remove('zona-alvo'));
  dr.el.classList.remove('arrastando');
  const r = ctxRun(), d = desafioAtual();
  if (!r || !d || !z) return;
  const m = estadoDe(r, d);
  if (d.tipo === 'classificar' && dr.el.dataset.c !== undefined) {
    const i = Number(dr.el.dataset.c);
    if (m.fix[i]) return;
    if (z.dataset.zona === 'caixa') delete m.pos[i]; else if (z.dataset.zona) m.pos[i] = z.dataset.zona;
    m.sel = null; Som.tocar('encaixe'); mexeu();
  } else if (d.tipo === 'montar') {
    const bid = dr.el.dataset.bid;
    if (z.id === 'pool') { const ai = m.area.indexOf(bid); if (ai >= 0) { m.area.splice(ai, 1); Som.tocar('clique'); mexeu(); } return; }
    if (z.id !== 'area') return;
    const linhas = $$('#area .bloco').filter(x => x !== dr.el);
    let pos = linhas.length;
    for (let k = 0; k < linhas.length; k++) { const rr = linhas[k].getBoundingClientRect(); if (e.clientY < rr.top + rr.height / 2) { pos = k; break; } }
    const ai = m.area.indexOf(bid);
    if (ai >= 0) m.area.splice(ai, 1);
    m.area.splice(Math.min(pos, m.area.length), 0, bid);
    Som.tocar('encaixe'); mexeu();
  }
}

    itens.push({ txt: `Vencer o chefe: ${ANDARES[r.andar].chefe}`, ok: false });
  } else if (prox) {
    const cap = CAPITULOS.find(c => c.andar === prox);
    destaque = `Suba ao Andar ${prox}: ${ANDARES[prox].nome}`;
    if (cap) itens.push({ txt: `Ler o capítulo "${cap.nome}" do Manual (opcional, vale 1 moeda)`, ok: !!(S.capPago && S.capPago[cap.id]) });
    itens.push({ txt: `Vencer o Andar ${prox}`, ok: false });
  } else {
    destaque = 'Você venceu os 6 andares da torre!';
    itens.push({ txt: 'Baixar o crachá final e enviar no Classroom', ok: false });
  }
  if (Object.keys(S.andares).length) itens.push({ txt: 'Baixar o crachá (PNG) e enviar no Classroom', ok: false });
  if (S.moedas > 0) itens.push({ txt: `Gastar ${S.moedas} moeda${S.moedas > 1 ? 's' : ''} na Loja`, ok: false });
  return { destaque, itens };
}

function sairTutorial(concluiu) {

function tickTutorial() {

const NIVEIS_VELHA = {

  cavaleiro: { nome: 'Gerente', desc: 'Ganha, bloqueia e prefere o centro. Dá para vencer com armadilha dupla.' },
  mestre: { nome: 'Diretora', desc: 'Joga perfeito. O melhor resultado possível é empate.' },

let velha = null;
function sorteia(lista) { return lista[randInt(lista.length)]; }
const LINHAS_VELHA = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
function vencedorVelha(t) {
  for (const [a, b, c] of LINHAS_VELHA) if (t[a] && t[a] === t[b] && t[a] === t[c]) return t[a];
  return t.every(x => x) ? 'empate' : null;
}
function jogadaQueFecha(t, quem) {
  for (const [a, b, c] of LINHAS_VELHA) {
    const l = [t[a], t[b], t[c]];
    if (l.filter(x => x === quem).length === 2 && l.includes('')) return [a, b, c][l.indexOf('')];
  }

}
function contaAmeacas(t, quem) { let n = 0; for (const [a, b, c] of LINHAS_VELHA) { const l = [t[a], t[b], t[c]]; if (l.filter(x => x === quem).length === 2 && l.includes('')) n++; } return n; }
const MEMO_VELHA = new Map();
function minimax(t, vez, prof = 0) {
  const chave = t.join(',') + vez + prof;
  if (MEMO_VELHA.has(chave)) return MEMO_VELHA.get(chave);
  const r = minimaxCalc(t, vez, prof);

}
function minimaxCalc(t, vez, prof) {
  const w = vencedorVelha(t);
  if (w === 'O') return { s: 10 - prof }; if (w === 'X') return { s: prof - 10 }; if (w === 'empate') return { s: 0 };
  let melhor = { s: vez === 'O' ? -99 : 99, i: -1 };
  for (let i = 0; i < 9; i++) {
    if (t[i]) continue;
    t[i] = vez;
    const r = minimax(t, vez === 'O' ? 'X' : 'O', prof + 1);
    t[i] = '';
    if ((vez === 'O' && r.s > melhor.s) || (vez === 'X' && r.s < melhor.s)) melhor = { s: r.s, i };
  }
  return melhor;
}
function jogadaMestre(t, nivel) {
  const livres = t.map((x, k) => x ? -1 : k).filter(k => k >= 0);
  const ganhar = jogadaQueFecha(t, 'O'), bloquear = jogadaQueFecha(t, 'X');

    if (ganhar >= 0 && randInt(100) < 80) return { i: ganhar };
    if (bloquear >= 0 && randInt(100) < 50) return { i: bloquear, fala: 'bloqueio' };
    return { i: livres[randInt(livres.length)] };
  }
  if (nivel === 'cavaleiro') {
    if (ganhar >= 0) return { i: ganhar };
    if (bloquear >= 0) return { i: bloquear, fala: 'bloqueio' };
    for (const i of livres) { const c = t.slice(); c[i] = 'O'; if (contaAmeacas(c, 'O') >= 2) return { i, fala: 'armadilha' }; }

  if (bloquear >= 0 && ganhar < 0) return { i: bloquear, fala: 'bloqueio' };
  let melhor = -99, opcoes = [];

    const c = t.slice(); c[i] = 'O';
    const s = minimax(c, 'X', 1).s;
    if (s > melhor) { melhor = s; opcoes = [i]; } else if (s === melhor) opcoes.push(i);
  }
  const i = opcoes[randInt(opcoes.length)];

const DIRECOES = [[0, 1], [1, 0], [1, 1]];
function gerarCaca(palavras, n) {
  for (let tentativa = 0; tentativa < 80; tentativa++) {
    const g = Array.from({ length: n }, () => Array(n).fill(''));
    const postas = [];
    let ok = true;
    for (const p of palavras.slice().sort((a, b) => b.length - a.length)) {
      let posta = false;
      for (let k = 0; k < 300 && !posta; k++) {
        const [dl, dc] = DIRECOES[randInt(DIRECOES.length)];
        const l0 = randInt(n - dl * (p.length - 1)), c0 = randInt(n - dc * (p.length - 1));
        let cabe = true;
        for (let i = 0; i < p.length; i++) { const v = g[l0 + dl * i][c0 + dc * i]; if (v && v !== p[i]) { cabe = false; break; } }
        if (!cabe) continue;
        for (let i = 0; i < p.length; i++) g[l0 + dl * i][c0 + dc * i] = p[i];
        postas.push({ p, l0, c0, dl, dc });
        posta = true;
      }
      if (!posta) { ok = false; break; }
    }
    if (!ok) continue;
    const ABC = 'ABCDEFGHIJLMNOPQRSTUVXZ';
    for (let l = 0; l < n; l++) for (let c = 0; c < n; c++) if (!g[l][c]) g[l][c] = ABC[randInt(ABC.length)];
    return { g, postas };
  }
  return null;
}

function tocarCaca(l, c2) {
  if (caca.fim) return;

  const [l0, c0] = caca.sel;
  caca.sel = null;
  const dl = Math.sign(l - l0), dc = Math.sign(c2 - c0), len = Math.max(Math.abs(l - l0), Math.abs(c2 - c0)) + 1;
  const reta = (l - l0 === 0 || c2 - c0 === 0 || Math.abs(l - l0) === Math.abs(c2 - c0)) && len > 1;
  if (reta) {
    let s = ''; for (let i = 0; i < len; i++) s += caca.g[l0 + dl * i][c0 + dc * i];
    const inv = s.split('').reverse().join('');
    const p = caca.postas.find(x => !caca.achadas.includes(x.p) && (x.p === s || x.p === inv) && ((x.l0 === l0 && x.c0 === c0) || (x.l0 === l && x.c0 === c2)));

      return;
    }
  }
  Som.tocar('erro');
  bonusCaca(); focarCaca(l, c2);
}

function parseTabela(txt) {
  const linhas = txt.split(/\r?\n/).filter(l => l.trim());
  if (!linhas.length) return [];
  const sep = linhas[0].includes('\t') ? '\t' : (linhas[0].split(';').length > linhas[0].split(',').length ? ';' : ',');
  const split = (l) => {
    if (sep === '\t') return l.split('\t');
    const out = []; let cur = '', q = false;
    for (const ch of l) {
      if (ch === '"') q = !q;
      else if (ch === sep && !q) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur); return out;
  };
  const cab = split(linhas[0]).map(normTxt);
  const idx = (pred) => cab.findIndex(pred);
  const iNome = idx(h => h.includes('nome'));
  const iNum = idx(h => h.startsWith('n') && (h.includes('numero') || h === 'n' || h === 'no' || h.includes('chamada') || h === 'num'));
  const iTurma = idx(h => h.includes('turma'));
  const iEscola = idx(h => h.includes('escola') || h.includes('colegio') || h.includes('instituicao'));
  const iCod = idx(h => h.includes('codigo') || h.includes('conferencia'));
  if ([iNome, iNum, iTurma, iCod].some(i => i < 0)) return { erro: 'Não achei as colunas. O cabeçalho precisa ter: Nome, Número, Turma e Código (Colégio é opcional quando só há um colégio).' };
  return linhas.slice(1).map(l => {
    const c = split(l);
    const esc = iEscola >= 0 ? escolaPorTexto(c[iEscola]) : (CFG.escolas.length === 1 ? CFG.escolas[0] : null);
    return { nome: (c[iNome] || '').trim(), numero: (c[iNum] || '').trim(), escola: esc ? esc.sigla : (c[iEscola] || '').trim(), escolaOk: !!esc, turma: (c[iTurma] || '').trim(), codigo: (c[iCod] || '').trim() };
  });
}

const MODELO_FORMS = { nome: 'nome', numero: 'numero', n: 'numero', escola: 'escola', colegio: 'escola', turma: 'turma', codigo: 'codigo', nota: 'nota' };
function gerarModeloForms(link) {
  let u;
  try { u = new URL(String(link).trim()); } catch (e) { return { ok: false, erro: 'Isso não é um link. Copie o link inteiro, começando com https://' }; }
  if (!/docs\.google\.com$/.test(u.hostname) || !/\/forms\//.test(u.pathname)) return { ok: false, erro: 'O link precisa ser do Google Forms (docs.google.com/forms/...). O link curto forms.gle não serve: use o link pré-preenchido.' };
  const achados = {};
  const partes = [];
  for (const [k, v] of u.searchParams) {
    if (!/^entry\.\d+$/.test(k)) continue;
    const campo = MODELO_FORMS[normTxt(v).replace(/ /g, '')];
    if (!campo) continue;
    achados[campo] = k;
    partes.push(`${k}={${campo}}`);
  }
  const faltam = ['nome', 'numero', 'turma', 'codigo'].filter(c => !achados[c]);
  if (faltam.length) return { ok: false, erro: `Não achei no link os campos: ${faltam.map(f => f.toUpperCase()).join(', ')}. Confira se você digitou as palavras-modelo no link pré-preenchido.`, achados };
  const base = `${u.origin}${u.pathname.replace(/\/(viewform|formResponse|prefill)$/, '/viewform')}`;
  return { ok: true, url: `${base}?usp=pp_url&${partes.join('&')}`, achados };
}

function faixaDe(dados) {
  const e = dados.estrelas;
  let andares = 0;
  for (let i = 0; i < 6; i++) { if (e[i] > 0) andares = i + 1; else break; }
  if (andares === 6 && e.reduce((a, b) => a + b, 0) === 18) return 7;
  return andares;
}
function nomeMural(nome, numero) {
  const p = String(nome).trim().split(/\s+/);

function juntarMural() {

async function lerPlanilhaPublicada(url) {
  try {

    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    if (/<html/i.test(txt.slice(0, 200))) throw new Error('o link abriu uma página, não um CSV (a planilha está publicada como CSV?)');
    const rows = parseTabela(txt);
    if (rows.erro) throw new Error(rows.erro);
    muralLinhas = rows.map(r => {
      if (!r.escolaOk) return linhaAuditoria(r, 'COLÉGIO NÃO RECONHECIDO', null, 'planilha');
      const v = validarCodigo(r.codigo, r);
      return linhaAuditoria(r, v.ok ? 'OK' : v.motivo, v.dados, 'planilha');
    });
    muralStatus = `Planilha lida às ${new Date().toLocaleTimeString('pt-BR')} · ${muralLinhas.filter(l => l.status === 'OK').length} códigos válidos de ${muralLinhas.length} respostas.`;

    muralStatus = `Não consegui ler a planilha: ${e.message}. Sem internet, link errado ou conta da escola bloqueando a publicação. Os dados da aba Auditoria continuam valendo.`;
  }
}

function ligarMural(url) {
  pararMural();
  muralTimer = setInterval(async () => {
    if (!$('#mural')) { pararMural(); return; }
    await lerPlanilhaPublicada(url);
    const st = $('#mu-status'); if (st) st.textContent = muralStatus;
    desenharMural();
  }, 30000);
}
function pararMural() { if (muralTimer) clearInterval(muralTimer); muralTimer = null; }
function desenharMural() {
  const el = $('#mural');
  if (!el) return;
  const lista = juntarMural().filter(l => (!muralFiltro.serie || String(l.turma).startsWith(muralFiltro.serie)) && (!muralFiltro.turma || l.turma === muralFiltro.turma))
    .map(l => ({ ...l, faixa: faixaDe({ estrelas: l.estrelas }), total: l.estrelas.reduce((a, b) => a + b, 0) }));
  const titulo = muralFiltro.turma || (muralFiltro.serie ? muralFiltro.serie + ' ano' : 'Todas as turmas');
  el.innerHTML = `<div class="mural">
    <div class="mural-topo"><h2>${ico('predio')} A Torre Horizonte</h2><span>${escHtml(titulo)} · ${lista.length} aventureiro${lista.length === 1 ? '' : 's'}</span></div>
    ${MURAL_FAIXAS.map((f, i) => {
      const aqui = lista.filter(l => l.faixa === f.id).sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome));
      return `<section class="faixa ${f.tema}">
        <header>${ico(f.ico)} <b>${escHtml(f.nome)}</b> <small>${escHtml(f.sub)} · ${aqui.length}</small></header>
        <div class="fichas">${aqui.map(l => `<span class="nome-mural" title="${escHtml(l.nome)} · ${escHtml(l.turma)}">${escHtml(nomeMural(l.nome, l.numero))} <i>★${l.total}</i></span>`).join('') || '<span class="vazia">ninguém neste andar ainda</span>'}</div>
      </section>`;
    }).join('')}
  </div>`;
}

function iniciar() {

  document.addEventListener('pointerdown', iniciarArrasto);
  document.addEventListener('pointermove', moverArrasto, { passive: false });

  document.addEventListener('pointercancel', () => {
    if (drag && drag.ghost) { drag.ghost.remove(); drag.el.classList.remove('arrastando'); $$('.zona-alvo').forEach(x => x.classList.remove('zona-alvo')); }
    drag = null;
  });
  const bloqueia = (e) => { if (telaAtual === 'desafio' && !sandbox) e.preventDefault(); };
  document.addEventListener('contextmenu', bloqueia);
  document.addEventListener('copy', bloqueia);
  document.addEventListener('cut', bloqueia);
  document.addEventListener('dragstart', (e) => { if (e.target.closest && e.target.closest('#mesa')) e.preventDefault(); });
  window.addEventListener('error', (ev) => { try { toast('Erro interno: ' + ev.message, 6000); } catch (e) { } });
  iniciarVigia();
  mostrar('inicio');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
